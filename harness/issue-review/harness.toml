name = "issue-review"
version = "1.0.0"
description = "Review the commit at HEAD on a clean checkout and commit straightforward fixes"
requires = ["git"]
docs = "https://github.com/EmilienxD/harness/blob/main/harness/issue-review/README.md"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "shared/skills/issue-review/SKILL.md"
dest = "issue-review/SKILL.md"
root = "skills"

[[files]]
src = "shared/hooks/issue_review_UserPromptSubmit_hook.py"
dest = "issue_review_UserPromptSubmit_hook.py"
root = "hooks"
executable = true

[[files]]
src = "chatgpt/skills/issue-review/agents/openai.yaml"
dest = "issue-review/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
