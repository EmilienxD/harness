name = "issues"
version = "1.13.5"
description = "Draft, spec and publish reviewed GitHub issues - one at a time or a whole plan"
requires = ["git", "gh"]
docs = "https://github.com/EmilienxD/harness/blob/main/harness/issues/README.md"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "shared/hooks/issues_core.py"
dest = "issues_core.py"
root = "hooks"
executable = true

[[files]]
src = "claude/hooks/publish_issues_UserPromptSubmit_hook.py"
dest = "publish_issues_UserPromptSubmit_hook.py"
root = "hooks"
executable = true
platforms = ["claude"]

[[files]]
src = "claude/skills/draft-issue"
dest = "draft-issue"
root = "skills"
platforms = ["claude"]

[[files]]
src = "claude/skills/draft-issues"
dest = "draft-issues"
root = "skills"
platforms = ["claude"]

[[files]]
src = "claude/skills/publish-issues"
dest = "publish-issues"
root = "skills"
platforms = ["claude"]

[[files]]
src = "claude/skills/to-spec"
dest = "to-spec"
root = "skills"
platforms = ["claude"]

[[files]]
src = "claude/skills/to-spec-draft-issue"
dest = "to-spec-draft-issue"
root = "skills"
platforms = ["claude"]

[[files]]
src = "chatgpt/hooks/issues_ChatGPT_hook.py"
dest = "issues_ChatGPT_hook.py"
root = "hooks"
executable = true
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/skills/draft-issue/SKILL.md"
dest = "draft-issue/SKILL.md"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/skills/draft-issues/SKILL.md"
dest = "draft-issues/SKILL.md"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/skills/publish-issues/SKILL.md"
dest = "publish-issues/SKILL.md"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/skills/to-spec/SKILL.md"
dest = "to-spec/SKILL.md"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/skills/to-spec-draft-issue/SKILL.md"
dest = "to-spec-draft-issue/SKILL.md"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/skills/draft-issue/agents/openai.yaml"
dest = "draft-issue/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/skills/draft-issues/agents/openai.yaml"
dest = "draft-issues/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

