name = "issues"
version = "1.13.0"
description = "Draft, spec and publish reviewed GitHub issues - one at a time or a whole plan"
requires = ["git", "gh"]
docs = "https://github.com/EmilienxD/harness/blob/main/harness/issues/README.md"

[platforms.chatgpt]
status = "supported"
fragment = "targets/chatgpt/hooks.fragment.json"

[[files]]
src = "hooks/publish_issues_UserPromptSubmit_hook.py"
dest = "hooks/publish_issues_UserPromptSubmit_hook.py"
executable = true
platforms = ["claude"]

[[files]]
src = "skills/draft-issue"
dest = "skills/draft-issue"
platforms = ["claude"]

[[files]]
src = "skills/draft-issues"
dest = "skills/draft-issues"
platforms = ["claude"]

[[files]]
src = "skills/publish-issues"
dest = "skills/publish-issues"
platforms = ["claude"]

[[files]]
src = "skills/to-spec"
dest = "skills/to-spec"
platforms = ["claude"]

[[files]]
src = "skills/to-spec-draft-issue"
dest = "skills/to-spec-draft-issue"
platforms = ["claude"]

[[files]]
src = "hooks/publish_issues_UserPromptSubmit_hook.py"
dest = "issues_core.py"
root = "hooks"
executable = true
platforms = ["chatgpt"]

[[files]]
src = "targets/chatgpt/hooks/issues_ChatGPT_hook.py"
dest = "issues_ChatGPT_hook.py"
root = "hooks"
executable = true
platforms = ["chatgpt"]

[[files]]
