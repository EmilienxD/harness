name = "communication-hooks"
version = "1.0.0"
description = "Task-bound delegation inbox, lifecycle, and durable parent-delivery hooks"
dependencies = ["harness-cli>=0.3.0,<0.4.0"]
workspace_gitignore = [".harness/runtime/"]

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "shared/hooks/delegation_hook.py"
dest = "delegation_hook.py"
root = "hooks"
executable = true
