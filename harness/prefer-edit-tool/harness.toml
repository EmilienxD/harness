name = "prefer-edit-tool"
version = "1.0.2"
description = "PostToolUse nudge to prefer the Write/Edit tools over heredocs, redirects, sed -i and inline python for file writes"
docs = "https://github.com/EmilienxD/harness/blob/main/harness/prefer-edit-tool/README.md"

[platforms.chatgpt]
status = "unsupported"
reason = "This preference is specific to Claude Code; ChatGPT already uses apply_patch as its native edit path."

[[files]]
src = "hooks/prefer_edit_tool_PostToolUse_hook.py"
dest = "hooks/prefer_edit_tool_PostToolUse_hook.py"
executable = true
