name = "copy-all"
version = "1.0.1"
description = "Copy the current Pi conversation's user and assistant messages to the clipboard"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#copy-all"

[platforms.claude]
status = "unsupported"
reason = "Uses Pi's session and clipboard APIs."

[platforms.chatgpt]
status = "unsupported"
reason = "Uses Pi's session and clipboard APIs."

[platforms.pi]
status = "supported"

[[files]]
src = "pi/index.ts"
dest = "harness-copy-all/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "pi/package.json"
dest = "harness-copy-all/package.json"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "pi/package-lock.json"
dest = "harness-copy-all/package-lock.json"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "pi/tsconfig.json"
dest = "harness-copy-all/tsconfig.json"
root = "extensions"
platforms = ["pi"]

