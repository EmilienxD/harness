name = "tool-inspector"
version = "1.0.3"
description = "Show Pi's installed tools at startup and inspect their contracts with /tools"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#tool-inspector"

[platforms.claude]
status = "unsupported"
reason = "Inspects Pi's native tool registry and terminal UI."

[platforms.chatgpt]
status = "unsupported"
reason = "Inspects Pi's native tool registry and terminal UI."

[platforms.pi]
status = "supported"

[[files]]
src = "pi/extension.ts"
dest = "harness-tool-inspector/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "pi/startup.ts"
dest = "harness-tool-inspector/startup.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "pi/report.ts"
dest = "harness-tool-inspector/report.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "pi/schema.ts"
dest = "harness-tool-inspector/schema.ts"
root = "extensions"
platforms = ["pi"]
