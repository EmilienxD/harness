name = "todo-hitl"
version = "1.1.1"
description = "Mark deferred code work for human review and address it deliberately"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "mark-as-todo-hitl/SKILL.md"
dest = "mark-as-todo-hitl/SKILL.md"
root = "skills"

[[files]]
src = "address-todo-hitl/SKILL.md"
dest = "address-todo-hitl/SKILL.md"
root = "skills"

[[files]]
src = "mark-as-todo-hitl/chatgpt/openai.yaml"
dest = "mark-as-todo-hitl/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "address-todo-hitl/chatgpt/openai.yaml"
dest = "address-todo-hitl/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
