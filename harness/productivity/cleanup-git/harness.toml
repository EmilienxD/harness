name = "cleanup-git"
version = "1.1.3"
description = "Explain every local branch and worktree before confirming cleanup"
requires = ["git"]

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "SKILL.md"
dest = "cleanup-git/SKILL.md"
root = "skills"

[[files]]
src = "cleanup_git_hook.py"
dest = "cleanup_git_hook.py"
root = "hooks"
executable = true

[[files]]
src = "cleanup_git.py"
dest = "cleanup_git.py"
root = "hooks"
executable = true

[[files]]
src = "cleanup_git.py"
dest = "cleanup-git/cleanup_git.py"
root = "skills"
executable = true

[[files]]
src = "chatgpt/openai.yaml"
dest = "cleanup-git/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
