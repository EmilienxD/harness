name = "cleanup-git"
version = "1.2.5"
description = "Explain every local branch and worktree before confirming cleanup"
requires = ["git"]
dependencies = [{ name = "pi-transport", version = ">=1.0.0,<2.0.0", lifecycle = "coupled", platforms = ["pi"] }]

[platforms.pi]
status = "supported"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "SKILL.md"
dest = "cleanup-git/SKILL.md"
root = "skills"

[[files]]
src = "cleanup_git_hook.py"
dest = "cleanup_git_hook.py"
root = "hooks"
platforms = ["claude", "chatgpt"]
executable = true

[[files]]
src = "cleanup_git_hook.py"
dest = "cleanup_git_hook.py"
root = "support"
platforms = ["pi"]
executable = true

[[files]]
src = "cleanup_git.py"
dest = "cleanup_git.py"
root = "hooks"
platforms = ["claude", "chatgpt"]
executable = true

[[files]]
src = "cleanup_git.py"
dest = "cleanup_git.py"
root = "support"
platforms = ["pi"]
executable = true

[[files]]
src = "cleanup_git.py"
dest = "cleanup-git/cleanup_git.py"
root = "skills"
executable = true

[[files]]
src = "chatgpt/openai.yaml"
dest = "cleanup-git/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "pi/extension.ts"
dest = ".harness-cleanup-git/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "cleanup_git_pi.py"
dest = "cleanup_git_pi.py"
root = "support"
platforms = ["pi"]
