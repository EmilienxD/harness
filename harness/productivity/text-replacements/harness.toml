name = "text-replacements"
version = "1.0.2"
description = "Add or change always-on AutoHotkey text replacements (Windows only)"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "text-replacements/SKILL.md"
root = "skills"

[[files]]
src = "chatgpt/openai.yaml"
dest = "text-replacements/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
