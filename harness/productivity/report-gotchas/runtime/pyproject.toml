[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-report-gotchas-runtime"
version = "1.1.2"
description = "Discord delivery runtime for Harness gotcha reports"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
harness-report-gotchas = "report_gotchas.cli:main"
harness-report-gotchas-hook = "report_gotchas.hooks:main"

[tool.hatch.build.targets.wheel]
packages = ["src/report_gotchas"]
