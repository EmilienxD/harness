name = "report-gotchas"
version = "2.2.0"
description = "Send noteworthy agent handoff gotchas to Discord"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#model-invoked-skills"
requires = ["python"]

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "runtime/src/report_gotchas/__init__.py"
dest = "report-gotchas/scripts/report_gotchas/__init__.py"
root = "skills"

[[files]]
src = "runtime/src/report_gotchas/cli.py"
dest = "report-gotchas/scripts/report_gotchas/cli.py"
root = "skills"

[[files]]
src = "runtime/src/report_gotchas/config.py"
dest = "report-gotchas/scripts/report_gotchas/config.py"
root = "skills"

[[files]]
src = "runtime/src/report_gotchas/discord.py"
dest = "report-gotchas/scripts/report_gotchas/discord.py"
root = "skills"

[[files]]
src = "runtime/src/report.py"
dest = "report-gotchas/scripts/report.py"
root = "skills"

[[files]]
src = "SKILL.md"
dest = "report-gotchas/SKILL.md"
root = "skills"

[[files]]
src = "chatgpt/openai.yaml"
dest = "report-gotchas/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
