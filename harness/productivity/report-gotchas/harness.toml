name = "report-gotchas"
version = "2.1.0"
description = "Send noteworthy agent handoff gotchas to Discord"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#model-invoked-skills"
requires = ["git", "uv"]

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "report-gotchas/SKILL.md"
root = "skills"

[[files]]
src = "chatgpt/openai.yaml"
dest = "report-gotchas/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
