name = "writing-for-agents"
version = "1.1.0"
description = "Guidance for writing predictable documents consumed by agents"
docs = "https://github.com/EmilienxD/harness/blob/main/harness/productivity/writing-for-agents/SKILL.md"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "writing-for-agents/SKILL.md"
root = "skills"

[[files]]
src = "SKILL-MECHANICS.md"
dest = "writing-for-agents/SKILL-MECHANICS.md"
root = "skills"

[[files]]
src = "chatgpt/openai.yaml"
dest = "writing-for-agents/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
