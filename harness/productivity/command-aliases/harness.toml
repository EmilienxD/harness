name = "command-aliases"
version = "1.0.2"
description = "Add or modify cross-platform shell command aliases (PowerShell, Bash, Zsh)"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "command-aliases/SKILL.md"
root = "skills"

[[files]]
src = "chatgpt/openai.yaml"
dest = "command-aliases/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
