name = "handoff-grilling"
version = "1.1.0"
description = "Preserves a grill-me conversation in a detailed handoff doc"
docs = "https://github.com/EmilienxD/harness/blob/main/harness/productivity/handoff-grilling/SKILL.md"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "handoff-grilling/SKILL.md"
