name = "web-toolkit"
version = "1.4.0"
description = "Local web search and page fetching CLI, with native Pi tools"
requires = ["git", "uv"]
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#web-toolkit"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "web-toolkit/SKILL.md"
root = "skills"
platforms = ["claude", "chatgpt"]

[[files]]
src = "chatgpt/openai.yaml"
dest = "web-toolkit/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "pi/extension.ts"
dest = ".harness-web-toolkit/index.ts"
root = "extensions"
platforms = ["pi"]
