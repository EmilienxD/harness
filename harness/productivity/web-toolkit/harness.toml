name = "web-toolkit"
version = "1.5.0"
description = "Skill for local web search and page fetching through the Web Toolkit CLI"
requires = ["git", "uv"]
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#web-toolkit"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "web-toolkit/SKILL.md"
root = "skills"
platforms = ["claude", "chatgpt", "pi"]

[[files]]
src = "chatgpt/openai.yaml"
dest = "web-toolkit/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
