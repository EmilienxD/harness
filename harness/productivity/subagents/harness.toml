name = "subagents"
version = "3.0.4"
description = "Persistent conversation delegation with mode-preserving resume"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"
dependencies = [
    { name = "pi-transport", version = ">=1.1.0,<2.0.0", lifecycle = "coupled", platforms = ["pi"] },
    { name = "pi-subagents-toolkit", version = ">=2.0.0,<3.0.0", lifecycle = "coupled", platforms = ["pi"] },
]

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[platforms.pi]
status = "supported"

[[files]]
src = "pi/extension.ts"
dest = ".harness-subagents/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "subagents-toolkit/SKILL.md"
dest = "subagents-toolkit/SKILL.md"
root = "skills"
platforms = ["claude", "chatgpt"]

[[files]]
src = "subagents-toolkit/chatgpt/openai.yaml"
dest = "subagents-toolkit/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "reply-to-agent/SKILL.md"
dest = "reply-to-agent/SKILL.md"
root = "skills"

[[files]]
src = "reply-to-agent/chatgpt/openai.yaml"
dest = "reply-to-agent/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "reply-to-agent-with-previous-message/SKILL.md"
dest = "reply-to-agent-with-previous-message/SKILL.md"
root = "skills"
platforms = ["claude", "chatgpt"]

[[files]]
src = "reply-to-agent-with-previous-message/chatgpt/openai.yaml"
dest = "reply-to-agent-with-previous-message/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[actions]]
type = "uv-tool"
package = "harness-subagents-runtime"
source = "git+https://github.com/EmilienxD/harness@c650a6f8317646ec2ae817798d69c9d3efe5756f#subdirectory=harness/productivity/subagents/runtime"
