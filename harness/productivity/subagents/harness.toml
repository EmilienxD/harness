name = "subagents"
version = "1.2.6"
description = "Visible subagent delegation with task-specific workflows"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"
dependencies = ["prototype>=1.1.0,<2.0.0", "websearch>=1.1.0,<2.0.0", "grill-me>=1.0.3,<2.0.0", "issue-readers>=1.0.0,<2.0.0"]
workspace_gitignore = [".harness/runtime/"]

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "work-with-agent"
dest = "work-with-agent"
root = "skills"

[[files]]
src = "explore-with-agent"
dest = "explore-with-agent"
root = "skills"

[[files]]
src = "prototype-with-agent"
dest = "prototype-with-agent"
root = "skills"

[[files]]
src = "websearch-with-agent"
dest = "websearch-with-agent"
root = "skills"

[[files]]
src = "brainstorm-with-agent"
dest = "brainstorm-with-agent"
root = "skills"

[[files]]
src = "address-with-agent"
dest = "address-with-agent"
root = "skills"

[[files]]
src = "review-with-agent"
dest = "review-with-agent"
root = "skills"

[[files]]
src = "reply-to-agent"
dest = "reply-to-agent"
root = "skills"

[[files]]
src = "chatgpt/agents/work-with-agent.yaml"
dest = "work-with-agent/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/agents/explore-with-agent.yaml"
dest = "explore-with-agent/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/agents/prototype-with-agent.yaml"
