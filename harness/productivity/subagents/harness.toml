name = "subagents"
version = "2.2.2"
description = "Persistent conversation delegation with mode-preserving resume"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"
dependencies = ["prototype>=1.1.0,<2.0.0", "websearch>=1.1.0,<2.0.0", "grill-me>=1.0.3,<2.0.0", "issue-readers>=1.0.0,<2.0.0"]

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "work-with-agent"
dest = "work-with-agent"
root = "skills"

