[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-subagents-runtime"
version = "2.6.2"
description = "Persistent delegation and execution runtime for Harness"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0,<7.0", "tomlkit>=0.13,<1.0"]

[project.scripts]
harness = "subagents_runtime.cli:main"
harness-subagents-hook = "subagents_runtime.hooks:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subagents_runtime"]

[tool.hatch.build.hooks.custom]
