name = "pi-subagents-toolkit"
version = "2.0.7"
description = "Shared toolkit skill read by Pi and the subagent runtime"
selectable = false

[platforms.pi]
status = "supported"

[platforms.claude]
status = "unsupported"
reason = "Installed directly by the subagents package."

[platforms.chatgpt]
status = "unsupported"
reason = "Installed directly by the subagents package."

[[files]]
src = "SKILL.md"
dest = "subagents-toolkit/SKILL.md"
root = "skills"
platforms = ["pi"]

[[files]]
src = "scripts/enable_inbox.py"
dest = "subagents-toolkit/scripts/enable_inbox.py"
root = "skills"
platforms = ["pi"]
