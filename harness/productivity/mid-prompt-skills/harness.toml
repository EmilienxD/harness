name = "mid-prompt-skills"
version = "1.2.1"
description = "Load skills invoked after other prompt text in Claude Code, ChatGPT, and Pi"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#hooks"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[platforms.pi]
status = "supported"

[[files]]
src = "pi/extension.ts"
dest = ".harness-mid-prompt-skills/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "mid_prompt_skills_hook.py"
dest = "mid_prompt_skills_hook.py"
root = "hooks"
platforms = ["claude", "chatgpt"]
executable = true
