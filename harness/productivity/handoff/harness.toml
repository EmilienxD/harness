name = "handoff"
version = "1.1.0"
description = "Compacts the conversation into a handoff doc for another agent"
docs = "https://github.com/EmilienxD/harness/blob/main/harness/productivity/handoff/shared/skills/handoff/SKILL.md"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[[files]]
src = "shared/skills/handoff/SKILL.md"
dest = "handoff/SKILL.md"
root = "skills"

[[files]]
src = "chatgpt/skills/handoff/agents/openai.yaml"
dest = "handoff/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
