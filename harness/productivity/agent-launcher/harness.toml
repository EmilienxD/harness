name = "agent-launcher"
version = "1.1.7"
description = "Project-configurable launcher for Claude Code and Codex"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[[files]]
src = "claude/SKILL.md"
dest = "extend-claude-system-prompt/SKILL.md"
root = "skills"
platforms = ["claude"]

[[files]]
src = "runtime/src/agent_launcher/templates"
dest = ".harness/agent-launcher"
root = "workspace"
scopes = ["project"]
starter = true

[[actions]]
type = "uv-tool"
package = "harness-agent-launcher"
source = "git+https://github.com/EmilienxD/harness@e1df37ca7c366a1e532260880f3bf1404cf71309#subdirectory=harness/productivity/agent-launcher/runtime"
