name = "background-shell"
version = "2.1.0"
description = "Pi background shell jobs with automatic completion, output browsing, and cancellation"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#background-shell"

[platforms.claude]
status = "unsupported"
reason = "Extends Pi's native shell tools only."

[platforms.chatgpt]
status = "unsupported"
reason = "Extends Pi's native shell tools only."

[platforms.pi]
status = "supported"

[[files]]
src = "pi/extension.ts"
dest = "harness-background-shell/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "pi/ui.ts"
dest = "harness-background-shell/ui.ts"
root = "extensions"
platforms = ["pi"]
