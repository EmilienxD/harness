name = "enable-desktop-notification"
version = "1.1.6"
description = "Enable desktop notifications for final responses in the current session without a model call"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[platforms.pi]
status = "supported"

[[dependencies]]
name = "pi-transport"
version = ">=1.0.0,<2.0.0"
platforms = ["pi"]
lifecycle = "coupled"

[[files]]
src = "pi/extension.ts"
dest = ".harness-enable-desktop-notification/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "desktop_notification_pi.py"
dest = "desktop_notification_pi.py"
root = "support"
platforms = ["pi"]

[[files]]
src = "enable_desktop_notification_hook.py"
dest = "enable_desktop_notification_hook.py"
root = "hooks"
executable = true
platforms = ["claude", "chatgpt"]

[[files]]
src = "desktop_notification.py"
dest = "desktop_notification.py"
root = "hooks"
platforms = ["claude", "chatgpt"]

[[files]]
src = "desktop_notification.py"
dest = "desktop_notification.py"
root = "support"
platforms = ["pi"]

[[files]]
src = "SKILL.md"
dest = "enable-desktop-notification/SKILL.md"
root = "skills"
platforms = ["claude", "chatgpt"]

[[files]]
src = "chatgpt/openai.yaml"
dest = "enable-desktop-notification/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
