name = "auto"
version = "1.1.0"
description = "Routes /auto and /auto --dry to an active Aboard session"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "shared/hooks/auto.py"
dest = "auto.py"
root = "hooks"
executable = true

[[files]]
src = "shared/skills/auto/SKILL.md"
dest = "auto/SKILL.md"
root = "skills"

[[files]]
src = "chatgpt/skills/auto/agents/openai.yaml"
dest = "auto/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
