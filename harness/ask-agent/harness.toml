name = "ask-agent"
version = "1.0.0"
description = "Open a task-bound inbox for general-purpose agent delegation"
dependencies = ["harness-cli>=0.3.0,<0.4.0", "communication-hooks>=1.0.0,<2.0.0", "reply-to-agent>=1.0.0,<2.0.0"]

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[[files]]
src = "shared/skills/ask-agent/SKILL.md"
dest = "ask-agent/SKILL.md"
root = "skills"

[[files]]
src = "chatgpt/skills/ask-agent/agents/openai.yaml"
dest = "ask-agent/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
