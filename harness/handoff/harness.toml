name = "handoff"
version = "1.0.2"
description = "Compacts the conversation into a handoff doc for another agent"
docs = "https://github.com/EmilienxD/harness/blob/main/harness/handoff/claude/skills/handoff/SKILL.md"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[[files]]
src = "claude/skills/handoff/SKILL.md"
dest = "handoff/SKILL.md"
root = "skills"
platforms = ["claude"]

[[files]]
src = "chatgpt/skills/handoff/SKILL.md"
dest = "handoff/SKILL.md"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/skills/handoff/agents/openai.yaml"
dest = "handoff/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
