name = "redirect-subagents"
version = "1.2.1"
description = "Redirect Claude Code's built-in Agent tool subagents to alternate providers, avoiding Claude subscription usage"
requires = []
docs = "https://github.com/EmilienxD/harness/blob/main/harness/redirect-subagents/README.md"

[[files]]
src = "hooks/rs_io.py"
dest = "hooks/rs_io.py"

[[files]]
src = "hooks/redirect_subagents_deny_PreToolUse_hook.py"
dest = "hooks/redirect_subagents_deny_PreToolUse_hook.py"
executable = true

[[files]]
src = "hooks/redirect_subagents_notify_PostToolUse_hook.py"
dest = "hooks/redirect_subagents_notify_PostToolUse_hook.py"
executable = true

[[files]]
src = "hooks/redirect_subagents_wait_hook.py"
dest = "hooks/redirect_subagents_wait_hook.py"
executable = true

# Example subagent config, installed as
# .claude/harness-redirect-subagents/subagents.json.
# `starter` means: copied when absent, never overwritten afterwards — the
# hooks read this file after the user edits it into real entries.
[[files]]
src = "subagents.example.json"
dest = "harness-redirect-subagents/subagents.json"
starter = true

# Gitignore for the tool's own state/config directory, installed inside it.
# Everything under harness-redirect-subagents/ is machine-local: runtime job
# state and this user's local config. `starter` so a curated ignore survives
# upgrades.
[[files]]
src = ".gitignore"
dest = "harness-redirect-subagents/.gitignore"
starter = true
