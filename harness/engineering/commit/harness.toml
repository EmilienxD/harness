name = "commit"
version = "1.8.2"
description = "Zero-model-turn /commit with native Pi branch attribution and shared Git/message generation"
requires = ["git"]
dependencies = [{ name = "pi-transport", version = ">=1.0.0,<2.0.0", lifecycle = "coupled", platforms = ["pi"] }]
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"

# Project-local credentials used by `--ai` stay outside version control.
workspace_gitignore = [".harness/config.local.json"]

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[platforms.pi]
status = "supported"

[[files]]
src = "pi/extension.ts"
dest = ".harness-commit/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "commit_pi.py"
dest = "commit_pi.py"
root = "support"
platforms = ["pi"]

[[files]]
src = "commit_hook.py"
dest = "commit_hook.py"
root = "hooks"
platforms = ["claude", "chatgpt"]
executable = true

[[files]]
src = "commit_hook.py"
dest = "commit_hook.py"
root = "support"
platforms = ["pi"]
executable = true

[[files]]
src = "SKILL.md"
dest = "commit/SKILL.md"
root = "skills"
platforms = ["claude", "chatgpt"]

[[files]]
src = "chatgpt/openai.yaml"
dest = "commit/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "commit_ownership.py"
dest = "commit_ownership.py"
root = "hooks"
platforms = ["claude", "chatgpt"]

[[files]]
src = "commit_ownership.py"
dest = "commit_ownership.py"
root = "support"
platforms = ["pi"]
