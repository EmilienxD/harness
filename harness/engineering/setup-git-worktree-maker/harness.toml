name = "setup-git-worktree-maker"
version = "1.1.0"
description = "Creates a project-native command for fully initialized Git worktrees"
docs = "https://github.com/EmilienxD/harness/blob/main/harness/engineering/setup-git-worktree-maker/SKILL.md"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "setup-git-worktree-maker/SKILL.md"
root = "skills"

[[files]]
src = "chatgpt/openai.yaml"
dest = "setup-git-worktree-maker/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
