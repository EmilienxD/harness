name = "validate-request"
version = "1.0.0"
description = "Explore and clarify a request into a chat report for user validation"
requires = ["git", "gh"]
docs = "https://github.com/EmilienxD/harness/blob/main/harness/validate-request/README.md"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "shared/skills/validate-request/SKILL.md"
dest = "validate-request/SKILL.md"
root = "skills"

[[files]]
src = "shared/hooks/validate_request_UserPromptSubmit_hook.py"
dest = "validate_request_UserPromptSubmit_hook.py"
root = "hooks"
executable = true

[[files]]
src = "chatgpt/skills/validate-request/agents/openai.yaml"
dest = "validate-request/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
