name = "commit"
version = "1.4.2"
description = "Zero-model-call /commit — stages and commits via native prompt hooks"
requires = ["git"]
docs = "https://github.com/EmilienxD/harness/blob/main/harness/commit/README.md"

# Secret/config files used by `--ai`. Paths are relative to the selected
# platform directory, so project installs ignore `.claude/...` or `.codex/...`.
gitignore = ["commit-ai.key", "settings.local.json"]

[platforms.chatgpt]
status = "supported"
fragment = "targets/chatgpt/hooks.fragment.json"

[[files]]
src = "hooks/commit_UserPromptSubmit_hook.py"
dest = "hooks/commit_UserPromptSubmit_hook.py"
executable = true
platforms = ["claude"]

[[files]]
src = "skills/commit"
dest = "skills/commit"
platforms = ["claude"]

[[files]]
src = "hooks/commit_UserPromptSubmit_hook.py"
dest = "commit_core.py"
root = "hooks"
executable = true
platforms = ["chatgpt"]

[[files]]
src = "targets/chatgpt/hooks/commit_ChatGPT_hook.py"
dest = "commit_ChatGPT_hook.py"
root = "hooks"
executable = true
platforms = ["chatgpt"]

[[files]]
src = "targets/chatgpt/skills/commit"
dest = "commit"
root = "skills"
platforms = ["chatgpt"]
