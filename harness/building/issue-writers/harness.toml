name = "issue-writers"
version = "2.3.12"
description = "Draft and publish GitHub issues"
requires = ["git", "gh"]
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"

dependencies = [{ name = "pi-issue-workflows", version = ">=1.0.3,<2.0.0", lifecycle = "coupled", platforms = ["pi"] }]

[platforms.pi]
status = "supported"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "issues_core.py"
dest = "issues_core.py"
root = "hooks"
platforms = ["claude", "chatgpt"]
executable = true

[[files]]
src = "issues_core.py"
dest = "issues_core.py"
root = "support"
platforms = ["pi"]
executable = true

[[files]]
src = "issue_writers_hook.py"
dest = "issue_writers_hook.py"
root = "hooks"
platforms = ["claude", "chatgpt"]
executable = true

[[files]]
src = "issue_writers_hook.py"
dest = "issue_writers_hook.py"
root = "support"
platforms = ["pi"]
executable = true

[[files]]
src = "draft-issue/SKILL.md"
dest = "draft-issue/SKILL.md"
root = "skills"

[[files]]
src = "draft-issues/SKILL.md"
dest = "draft-issues/SKILL.md"
root = "skills"

[[files]]
src = "publish-issues/SKILL.md"
dest = "publish-issues/SKILL.md"
root = "skills"
platforms = ["claude", "chatgpt"]

[[files]]
src = "to-spec/SKILL.md"
dest = "to-spec/SKILL.md"
root = "skills"

[[files]]
src = "to-spec-draft-issue/SKILL.md"
dest = "to-spec-draft-issue/SKILL.md"
root = "skills"

[[files]]
src = "draft-issue/chatgpt/openai.yaml"
dest = "draft-issue/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
[[files]]
src = "draft-issues/chatgpt/openai.yaml"
dest = "draft-issues/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "publish-issues/chatgpt/openai.yaml"
dest = "publish-issues/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "to-spec/chatgpt/openai.yaml"
dest = "to-spec/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "to-spec-draft-issue/chatgpt/openai.yaml"
dest = "to-spec-draft-issue/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "pi/extension.ts"
dest = ".harness-issue-writers/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "issue_writers_pi.py"
dest = "issue_writers_pi.py"
root = "support"
platforms = ["pi"]

[[files]]
src = "issues_core.py"
dest = "draft-issue/scripts/publish_issues.py"
root = "skills"
executable = true

[[files]]
src = "issues_core.py"
dest = "draft-issues/scripts/publish_issues.py"
root = "skills"
executable = true

[[files]]
src = "issues_core.py"
dest = "to-spec-draft-issue/scripts/publish_issues.py"
root = "skills"
executable = true
