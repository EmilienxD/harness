name = "issue-writers"
version = "1.2.0"
description = "Draft, publish, and directly copy responses to GitHub issues"
requires = ["git", "gh"]
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "copy_message_as_issue.py"
dest = "copy_message_as_issue.py"
root = "hooks"
executable = true

[[files]]
src = "copy-message-as-issue"
dest = "copy-message-as-issue"
root = "skills"

[[files]]
src = "issues_core.py"
dest = "issues_core.py"
root = "hooks"
executable = true

[[files]]
src = "issue_writers_hook.py"
dest = "issue_writers_hook.py"
root = "hooks"
executable = true

[[files]]
src = "draft-issue"
dest = "draft-issue"
root = "skills"

[[files]]
src = "draft-issues"
dest = "draft-issues"
root = "skills"

[[files]]
src = "draft-audit-issues"
dest = "draft-audit-issues"
root = "skills"

[[files]]
src = "publish-issues"
dest = "publish-issues"
root = "skills"

[[files]]
src = "to-spec"
dest = "to-spec"
root = "skills"

[[files]]
src = "to-spec-draft-issue"
dest = "to-spec-draft-issue"
root = "skills"

[[files]]
src = "chatgpt/agents/copy-message-as-issue.yaml"
dest = "copy-message-as-issue/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/agents/draft-issue.yaml"
dest = "draft-issue/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
[[files]]
src = "chatgpt/agents/draft-issues.yaml"
dest = "draft-issues/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/agents/draft-audit-issues.yaml"
dest = "draft-audit-issues/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/agents/publish-issues.yaml"
dest = "publish-issues/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/agents/to-spec.yaml"
dest = "to-spec/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
