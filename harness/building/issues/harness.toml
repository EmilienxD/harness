name = "issues"
version = "1.20.0"
description = "Draft, publish, address, and review GitHub issues"
requires = ["git", "gh"]
docs = "https://github.com/EmilienxD/harness/blob/main/harness/building/issues/README.md"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "claude/hooks/copy_message_as_issue.py"
dest = "copy_message_as_issue.py"
root = "hooks"
executable = true
platforms = ["claude"]

