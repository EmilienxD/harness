name = "test-workflows"
version = "1.3.0"
description = "Define and confirm end-to-end workflows when their covered code changes"
requires = ["git"]

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "test-workflows/SKILL.md"
root = "skills"

[[files]]
src = "chatgpt/openai.yaml"
dest = "test-workflows/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[actions]]
type = "uv-tool"
package = "harness-test-workflows"
source = "git+https://github.com/EmilienxD/harness@5c320e94ac77c1f038669d3ac5dea5f59cba125f#subdirectory=harness/building/test-workflows"
