name = "test-workflows"
version = "1.6.0"
description = "Define and confirm end-to-end workflows when their covered code changes"
requires = ["git", "uv"]

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "test-workflows/SKILL.md"
root = "skills"

[[files]]
src = "chatgpt/openai.yaml"
dest = "test-workflows/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
