name = "issue-readers"
version = "1.0.6"
description = "Prepare issue and commit context for implementation and review workers"
requires = ["git", "gh"]
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "address-this"
dest = "address-this"
root = "skills"
starter = true

[[files]]
src = "review-this"
dest = "review-this"
root = "skills"
starter = true

[[files]]
src = "address_issue_UserPromptSubmit_hook.py"
dest = "address_issue_UserPromptSubmit_hook.py"
root = "hooks"
executable = true

[[files]]
src = "review_issue_UserPromptSubmit_hook.py"
dest = "review_issue_UserPromptSubmit_hook.py"
root = "hooks"
executable = true

[[files]]
src = "chatgpt/agents/address-this.yaml"
dest = "address-this/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "chatgpt/agents/review-this.yaml"
dest = "review-this/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
