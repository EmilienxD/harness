name = "issue-readers"
version = "1.6.6"
description = "Prepare issue and commit context for address and review workers"
requires = ["git", "gh"]
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"

dependencies = [{ name = "pi-issue-workflows", version = ">=1.0.0,<2.0.0", lifecycle = "coupled", platforms = ["pi"] }]

[platforms.pi]
status = "supported"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "address-this/SKILL.md"
dest = "address-this/SKILL.md"
root = "skills"
starter = true

[[files]]
src = "review-this/SKILL.md"
dest = "review-this/SKILL.md"
root = "skills"
starter = true

[[files]]
src = "issue_readers_hook.py"
dest = "issue_readers_hook.py"
root = "hooks"
platforms = ["claude", "chatgpt"]
executable = true

[[files]]
src = "issue_readers_hook.py"
dest = "issue_readers_hook.py"
root = "support"
platforms = ["pi"]
executable = true

[[files]]
src = "issue_graph.py"
dest = "issue_graph.py"
root = "hooks"
platforms = ["claude", "chatgpt"]

[[files]]
src = "issue_graph.py"
dest = "issue_graph.py"
root = "support"
platforms = ["pi"]

[[files]]
src = "address-this/chatgpt/openai.yaml"
dest = "address-this/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "review-this/chatgpt/openai.yaml"
dest = "review-this/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "pi/extension.ts"
dest = ".harness-issue-readers/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "issue_readers_pi.py"
dest = "issue_readers_pi.py"
root = "support"
platforms = ["pi"]
