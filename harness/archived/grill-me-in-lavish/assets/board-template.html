<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grill Me | decision board</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@400;500;600;700&display=swap");

:root {
  --paper: #f5f3ee; --paper-2: #e8e4dd; --paper-3: #ded8cf; --surface: #fbfaf6;
  --ink: #2d2d2d; --ink-2: #0d0d0d; --ink-soft: #6b6862; --ink-faint: #96918a;
  --accent: #5b53ff; --accent-soft: #e6e5ff; --success: #12b76a; --success-soft: #dbf4e9;
  --font-head: "Space Grotesk", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, sans-serif; --radius-sm: 6px; --radius-md: 10px;
  --shadow-card: 10px 10px 0 var(--ink-2); --focus: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { color: var(--ink); background: var(--paper); font-family: var(--font-body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; }
button { color: inherit; }
.nav { border-bottom: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
.nav__inner { max-width: 1040px; min-height: 50px; margin: auto; padding: 7px 24px; display: flex; align-items: center; }
.brand { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.brand__mark { width: 28px; height: 28px; flex: none; display: grid; place-items: center; }
.brand__mark img { display: block; width: 27px; height: 27px; object-fit: contain; }
.brand__name { color: var(--ink-2); font: 650 14px/1 var(--font-head); }
.page { max-width: 1040px; margin: auto; padding: 26px 24px 58px; }
.deck-wrap { min-width: 0; }
.deck { position: relative; display: grid; margin: 4px 16px 20px 12px; }
/* Two rotated card faces peek out behind the active card, like a dealt stack
   of paper. The stack thins as you move through the questions: one edge
   disappears on the second-to-last question, both on the last. */
.deck::before, .deck::after { content: ""; position: absolute; inset: 0; z-index: 0; background: var(--surface); border: 1.5px solid var(--ink-2); border-radius: var(--radius-md); box-shadow: 4px 4px 0 var(--ink-2); }
.deck::before { transform: rotate(1.4deg) translate(5px, 6px); }
.deck::after { transform: rotate(-1.1deg) translate(-4px, 11px); }
.deck.is-penult::after { display: none; }
.deck.is-last::before, .deck.is-last::after { display: none; }
.question { grid-area: 1 / 1; z-index: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border: 1.5px solid var(--ink-2); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
/* Hidden cards are removed from layout so the deck sizes to the active card, not the tallest one. */
.question[hidden] { display: none; }
.question__pad { flex: 1 1 auto; display: flex; flex-direction: column; padding: clamp(24px, 4vw, 38px); }
.question__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; flex-wrap: wrap; }
.qid-slot { min-width: 0; flex: 1 1 auto; overflow-x: auto; }
.round-label { flex: 0 0 auto; color: var(--ink-soft); font: 650 10px/1 var(--font-head); letter-spacing: .13em; text-transform: uppercase; }
.question h2 { max-width: 760px; margin: 0; color: var(--ink-2); font: 600 clamp(19px, 2.8vw, 26px)/1.14 var(--font-head); letter-spacing: 0; text-wrap: balance; }
.explanation { min-width: 0; margin: 18px 0 22px; color: var(--ink-soft); font-size: 15px; line-height: 1.62; }
.explanation > :first-child { margin-top: 0; } .explanation > :last-child { margin-bottom: 0; }
.explanation p { margin: 0 0 12px; } .explanation h3 { color: var(--ink-2); font: 600 18px/1.3 var(--font-head); }
.explanation .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.explanation .grid > * { min-width: 0; }
.explanation .panel { padding: 16px; border: 1px solid var(--paper-3); border-radius: var(--radius-sm); background: var(--paper); }
.explanation .note { padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); color: var(--ink); }
.explanation .table-wrap { max-width: 100%; overflow-x: auto; }
.explanation table { width: 100%; border-collapse: collapse; font-size: 13px; }
.explanation th, .explanation td { padding: 10px 12px; border-bottom: 1px solid var(--paper-3); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.explanation th { color: var(--ink-2); font-weight: 700; }
.explanation img, .explanation svg, .explanation video, .explanation canvas { display: block; max-width: 100%; height: auto; }
.explanation figure { margin: 16px 0; } .explanation figcaption { margin-top: 8px; font-size: 12px; }
.explanation pre { max-width: 100%; overflow-x: auto; padding: 12px; background: var(--paper-2); border-radius: var(--radius-sm); }
.explanation select, .explanation input, .explanation button { max-width: 100%; }
.explanation details { padding: 12px 0; } .explanation summary { cursor: pointer; color: var(--ink); font-weight: 600; }
.explanation p, .explanation li { overflow-wrap: anywhere; }
.answer-form { flex: 1 1 auto; display: flex; flex-direction: column; gap: 15px; }
.options { display: flex; flex-direction: column; gap: 9px; }
.option { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 13px 14px; cursor: pointer; background: var(--surface); border: 1px solid var(--paper-3); border-radius: var(--radius-sm); transition: border-color 120ms, background 120ms, transform 120ms; }
.option:hover { border-color: color-mix(in srgb, var(--ink) 50%, transparent); transform: translateY(-1px); }
.option:has(input:focus-visible) { box-shadow: var(--focus); }
.option:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 44%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent); }
.option input { width: 17px; height: 17px; margin: 3px 0 0; accent-color: var(--accent); }
.option__copy { min-width: 0; } .option__label { display: block; color: var(--ink-2); font-size: 14px; font-weight: 700; }
.option__detail { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 12px; }
.option__badges { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 5px; align-self: center; }
.rec-badge { color: var(--accent); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent); border-radius: 5px; padding: 4px 7px 3px; font: 700 9px/1 var(--font-head); letter-spacing: .12em; text-transform: uppercase; }
.sel-badge { display: none; color: var(--success); background: var(--success-soft); border: 1px solid color-mix(in srgb, var(--success) 34%, transparent); border-radius: 5px; padding: 4px 7px 3px; font: 700 9px/1 var(--font-head); letter-spacing: .12em; text-transform: uppercase; }
.sel-badge.is-visible { display: inline-block; }
.text-link { display: block; margin-bottom: 7px; padding: 0; border: 0; color: var(--accent); background: transparent; cursor: pointer; font-size: 12px; }
.text-link:focus-visible { outline: none; box-shadow: var(--focus); }
.freeform textarea { width: 100%; min-height: 84px; resize: vertical; padding: 13px 14px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--paper-3); border-radius: var(--radius-sm); font-size: 13px; line-height: 1.45; }
.freeform textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
.question__foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-top: 15px; border-top: 1px solid color-mix(in srgb, var(--ink) 9%, transparent); }
.submit { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px; color: var(--paper); background: var(--ink-2); border: 1px solid var(--ink-2); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 700; transition: background 120ms, transform 120ms; }
.submit:hover { background: var(--ink); transform: translateY(-1px); } .submit:active { transform: translateY(1px); }
.submit:focus-visible { outline: none; box-shadow: var(--focus); }
.submit:disabled { opacity: .42; cursor: not-allowed; transform: none; }
.form-message { flex-basis: 100%; min-height: 18px; color: var(--accent); font-size: 12px; font-weight: 700; }
.round-submit { margin-left: auto; } .round-submit:disabled { opacity: .42; cursor: not-allowed; transform: none; }
.round-message { flex-basis: 100%; min-height: 18px; color: var(--accent); font-size: 12px; font-weight: 700; text-align: right; }
.question-map { display: flex; align-items: center; justify-content: flex-start; gap: 7px; min-height: 38px; padding: 1px 1px 3px; overflow-x: auto; }
.map-btn { min-width: 48px; height: 38px; flex: 0 0 auto; cursor: pointer; color: var(--ink-soft); background: transparent; border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); border-radius: var(--radius-sm); padding: 0 13px; font: 650 10px/1 var(--font-head); letter-spacing: .1em; transition: transform 120ms, border-color 120ms, background 120ms; }
.map-btn:hover { transform: translateY(-1px); border-color: var(--ink); } .map-btn:focus-visible { outline: none; box-shadow: var(--focus); }
.map-btn.is-active { color: var(--paper); border-color: var(--ink-2); background: var(--ink-2); }
.map-btn.is-queued, .map-btn.is-sent { color: var(--success); border-color: var(--success); background: var(--success-soft); }
.map-btn.is-active.is-queued, .map-btn.is-active.is-sent { color: var(--paper); background: var(--success); }
.fatal { max-width: 720px; margin: 50px auto; padding: 28px; background: var(--surface); border: 1.5px solid var(--ink-2); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
.fatal h2 { margin: 0 0 8px; color: var(--ink-2); font-family: var(--font-head); }
@media (prefers-reduced-motion: no-preference) { .question:not([hidden]) { animation: settle 260ms cubic-bezier(.2,.7,.2,1) both; } @keyframes settle { from { opacity: .72; } to { opacity: 1; } } }
@media (prefers-reduced-motion: reduce) { .explanation *, .explanation *::before, .explanation *::after { animation: none !important; transition: none !important; } }
@media (max-width: 640px) { .explanation .grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .nav__inner, .page { padding-left: 17px; padding-right: 17px; } .question__top { align-items: flex-start; } .option { grid-template-columns: auto minmax(0, 1fr); } .option__badges { grid-column: 2; justify-self: start; align-items: flex-start; } .question__foot { align-items: stretch; } .question__foot .submit { flex: 1 1 180px; } .question-map { gap: 4px; } .map-btn { min-width: 36px; padding: 0 6px; } }
</style>
</head>
<body>
<header class="nav">
  <div class="nav__inner">
    <span class="brand">
      <span class="brand__mark" aria-hidden="true"><img src="assets/aboard.svg" alt=""></span>
      <span class="brand__name">GrillMe in Lavish</span>
    </span>
  </div>
</header>

<main class="page" id="app">
  <section class="deck-wrap" aria-label="Questions">
    <div class="deck" id="deck"></div>
  </section>
</main>

<!--
Replace the single data placeholder in the script below with JSON shaped like:
{
  "round": 1,
  "questions": [{
    "id": "Q1",
    "question": "Where should configuration live?",
    "explanation_html": "<p>Explain why this decision matters.</p><p>Describe relevant consequences.</p>",
    "recommendation": "A",
    "init_js": "root.dataset.example = 'ready';",
    "options": [
      {"letter": "A", "label": "Project configuration", "detail": "Why this option matters."},
      {"letter": "B", "label": "User configuration", "detail": "Tradeoff or consequence."}
    ]
  }]
}
init_js is optional and runs once with the explanation element as root.
Only explanation_html is rendered as HTML; question and options are plain text.
-->
<script id="grill-data" type="application/json">
__GRILL_ME_DATA__
</script>

<script>
(function () {
  "use strict";

  function node(tag, className, text) {
    var element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined && text !== null) element.textContent = text;
    return element;
  }

  function fatal(message) {
    var app = document.getElementById("app");
    app.innerHTML = "";
    var box = node("section", "fatal");
    box.appendChild(node("h2", "", "This decision board could not load"));
    box.appendChild(node("p", "", message + " Ask the agent to rebuild the artifact."));
    app.appendChild(box);
  }

  var data;
  try {
    data = JSON.parse(document.getElementById("grill-data").textContent);
  } catch (error) {
    fatal("The embedded round data is not valid JSON.");
    return;
  }

  if (!data || typeof data !== "object") {
    fatal("The round data must be an object.");
    return;
  }
  var valid = data && Array.isArray(data.questions) && data.questions.length > 0 && data.questions.every(function (question) {
    return question && typeof question.id === "string" && question.id &&
      typeof question.question === "string" && question.question &&
      typeof question.explanation_html === "string" &&
      Array.isArray(question.options) && question.options.length >= 1 && question.options.length <= 4 &&
      question.options.some(function (option) { return option.letter === question.recommendation; }) &&
      question.options.every(function (option) {
        return option && typeof option.letter === "string" && typeof option.label === "string" && option.label;
      });
  });
  if (!valid) {
    fatal("The round data is missing required questions, explanations, options, or a valid recommendation.");
    return;
  }

  var deck = document.getElementById("deck");
  var map = node("div", "question-map");
  map.id = "question-map";
  map.setAttribute("role", "navigation");
  map.setAttribute("aria-label", "Question navigation");
  var states = data.questions.map(function () { return "open"; });
  var cards = [];
  var qidSlots = [];
  var mapButtons = [];
  var active = 0;
  var roundSubmitted = false;
  var roundButtons = [];
  var queueRefreshers = [];
  var roundMessages = [];

  function optionPrompt(question, form) {
    var selected = form.querySelector('input[name="answer"]:checked');
    var note = form.querySelector("textarea").value.trim();
    if (!selected && !note) return "";
    var lines = ["Answer to " + question.id + ": " + question.question];
    if (selected) {
      var selectedOption = question.options.find(function (option) { return option.letter === selected.value; });
      lines.push("Choice: " + selected.value + ": " + selectedOption.label);
      if (note) lines.push("Additional context: " + note);
    } else {
      lines.push("My own answer: " + note);
    }
    return lines.join("\n");
  }

  function updateProgress() {
    var queued = states.filter(function (state) { return state === "queued"; }).length;
    roundButtons.forEach(function (button) { button.disabled = roundSubmitted || queued === 0; });
  }

  function updateState(index, state) {
    states[index] = state;
    var card = cards[index];
    card.classList.toggle("is-queued", state === "queued");
    card.classList.toggle("is-sent", state === "sent");
    mapButtons[index].className = "map-btn" + (index === active ? " is-active" : "") + (state === "queued" ? " is-queued" : state === "sent" ? " is-sent" : "");
    updateProgress();
  }

  function show(index) {
    active = Math.max(0, Math.min(cards.length - 1, index));
    cards.forEach(function (card, cardIndex) {
      card.hidden = cardIndex !== active;
      card.inert = cardIndex !== active; /* hidden cards keep their layout, so block focus and clicks explicitly */
    });
    mapButtons.forEach(function (button, buttonIndex) {
      button.classList.toggle("is-active", buttonIndex === active);
      button.setAttribute("aria-current", buttonIndex === active ? "true" : "false");
    });
    deck.classList.toggle("is-penult", active === cards.length - 2);
    deck.classList.toggle("is-last", active === cards.length - 1);
    qidSlots[active].appendChild(map);
    renderMap();
  }

  /* Question navigation shows a fixed-size window of buttons that slides to keep
     the active question in view. Because the window always holds the same number
     of buttons (until there are fewer questions than that), the strip's width
     never changes and it doesn't shift around as you click through questions. */
  var NAV_WINDOW = 7;

  function renderMap() {
    map.innerHTML = "";
    var total = mapButtons.length;
    var size = Math.min(NAV_WINDOW, total);
    var start = Math.min(Math.max(0, active - Math.floor(size / 2)), total - size);
    for (var i = start; i < start + size; i++) {
      map.appendChild(mapButtons[i]);
    }
  }

  data.questions.forEach(function (question, index) {
    var card = node("article", "question");
    var pad = node("div", "question__pad");
    var top = node("div", "question__top");
    var qidSlot = node("div", "qid-slot");
    top.appendChild(qidSlot);
    qidSlots.push(qidSlot);
    top.appendChild(node("span", "round-label", "Round " + (data.round || 1)));
    pad.appendChild(top);
    pad.appendChild(node("h2", "", question.question));
    var explanation = node("div", "explanation");
    explanation.id = "explanation-" + question.id;
    explanation.innerHTML = question.explanation_html;
    pad.appendChild(explanation);

    var form = node("form", "answer-form");
    form.setAttribute("data-lavish-question", question.id);
    var options = node("div", "options");
    var selBadges = {};
    question.options.forEach(function (option) {
      var label = node("label", "option");
      var radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "answer";
      radio.value = option.letter;
      label.appendChild(radio);
      var copy = node("span", "option__copy");
      copy.appendChild(node("span", "option__label", option.letter + ". " + option.label));
      if (option.detail) copy.appendChild(node("span", "option__detail", option.detail));
      label.appendChild(copy);
      var badges = node("span", "option__badges");
      if (option.letter === question.recommendation) badges.appendChild(node("span", "rec-badge", "Recommended"));
      var selBadge = node("span", "sel-badge", "Selected");
      badges.appendChild(selBadge);
      label.appendChild(badges);
      selBadges[option.letter] = selBadge;
      options.appendChild(label);
    });
    form.appendChild(options);

    var freeform = node("div", "freeform");
    var ownAnswer = node("button", "text-link", "Write my own answer");
    ownAnswer.type = "button";
    freeform.appendChild(ownAnswer);
    var textareaId = "freeform-" + index;
    var textarea = document.createElement("textarea");
    textarea.id = textareaId;
    textarea.name = "note";
    textarea.maxLength = 2000;
    textarea.placeholder = "Add context or write your own answer...";
    textarea.setAttribute("aria-label", "Add context or write your own answer");
    freeform.appendChild(textarea);
    form.appendChild(freeform);

    var foot = node("div", "question__foot");
    var submit = node("button", "submit", "Queue answer");
    submit.type = "submit";
    foot.appendChild(submit);
    var roundSubmit = node("button", "submit round-submit", "Submit round");
    roundSubmit.type = "button";
    roundSubmit.disabled = true;
    foot.appendChild(roundSubmit);
    roundButtons.push(roundSubmit);
    var message = node("span", "form-message");
    message.setAttribute("role", "alert");
    foot.appendChild(message);
    var roundMessage = node("span", "round-message");
    roundMessage.setAttribute("role", "alert");
    foot.appendChild(roundMessage);
    roundMessages.push(roundMessage);
    form.appendChild(foot);

    var queuedAnswer = null;
    function currentAnswer() {
      var selected = form.querySelector('input[name="answer"]:checked');
      return { letter: selected ? selected.value : "", note: textarea.value.trim() };
    }
    function sameAnswer(a, b) { return a !== null && b !== null && a.letter === b.letter && a.note === b.note; }
    function refreshQueueButton() {
      submit.textContent = roundSubmitted ? "Round submitted" : queuedAnswer !== null ? "Update answer" : "Queue answer";
      submit.disabled = roundSubmitted || sameAnswer(currentAnswer(), queuedAnswer);
    }
    function showSelectedBadge() {
      Object.keys(selBadges).forEach(function (letter) {
        selBadges[letter].classList.toggle("is-visible", queuedAnswer !== null && letter === queuedAnswer.letter);
      });
    }
    function markEdited() {
      message.textContent = "";
      roundMessages.forEach(function (item) { item.textContent = ""; });
      if (queuedAnswer) updateState(index, "queued");
      refreshQueueButton();
    }
    queueRefreshers.push(refreshQueueButton);
    form.addEventListener("change", markEdited);
    textarea.addEventListener("input", markEdited);
    ownAnswer.addEventListener("click", function () {
      form.querySelectorAll('input[name="answer"]').forEach(function (radio) { radio.checked = false; });
      markEdited();
      textarea.focus();
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (roundSubmitted || sameAnswer(currentAnswer(), queuedAnswer)) return;
      message.textContent = "";
      var prompt = optionPrompt(question, form);
      if (!prompt) {
        message.textContent = "Choose an option or write your own answer first.";
        return;
      }
      if (!window.lavish || typeof window.lavish.queuePrompt !== "function") {
        message.textContent = "Open this artifact through Lavish to queue an answer.";
        return;
      }
      try {
        /* Intentionally send natural language only. No structured data object is
           attached, so JSON never becomes part of the agent conversation. */
        window.lavish.queuePrompt(prompt, {
          queueKey: "grill-round-" + (data.round || 1) + "-" + question.id,
          element: form
        });
        queuedAnswer = currentAnswer();
        updateState(index, "queued");
        showSelectedBadge();
        refreshQueueButton();
        message.textContent = "";
        var nextOpen = states.findIndex(function (state, stateIndex) { return stateIndex > index && state === "open"; });
        if (nextOpen < 0) nextOpen = states.findIndex(function (state) { return state === "open"; });
        if (nextOpen >= 0 && nextOpen !== index) setTimeout(function () { show(nextOpen); }, 420);
      } catch (error) {
        message.textContent = "Lavish could not queue this answer. Try again.";
      }
    });

    pad.appendChild(form);
    card.appendChild(pad);
    deck.appendChild(card);
    cards.push(card);
    if (question.init_js) {
      try {
        new Function("root", '"use strict";\n' + question.init_js)(explanation);
      } catch (error) {
        explanation.appendChild(node("p", "note", "The interactive example could not initialize. Ask the agent to repair it."));
        console.error("Grill explanation initialization failed", question.id, error);
      }
    }

    var mapButton = node("button", "map-btn", question.id);
    mapButton.type = "button";
    mapButton.setAttribute("aria-label", "Open " + question.id + ": " + question.question);
    mapButton.addEventListener("click", function () { show(index); });
    mapButtons.push(mapButton);
  });

  function submitRound() {
    roundMessages.forEach(function (item) { item.textContent = ""; });
    var queued = states.filter(function (state) { return state === "queued"; }).length;
    if (!queued) {
      roundMessages[active].textContent = "Queue at least one answer before submitting the round.";
      return;
    }
    if (!window.lavish || typeof window.lavish.sendQueuedPrompts !== "function") {
      roundMessages[active].textContent = "Open this artifact through Lavish to submit the round.";
      return;
    }
    try {
      window.lavish.sendQueuedPrompts();
      roundSubmitted = true;
      states.forEach(function (state, index) {
        if (state === "queued") updateState(index, "sent");
      });
      queueRefreshers.forEach(function (refresh) { refresh(); });
      cards.forEach(function (card) {
        card.querySelectorAll("input, textarea, button").forEach(function (control) { control.disabled = true; });
      });
      roundButtons.forEach(function (button) { button.textContent = "Round submitted"; });
      roundMessages[active].textContent = queued + " answer" + (queued === 1 ? "" : "s") + " sent to the agent.";
      updateProgress();
    } catch (error) {
      roundMessages[active].textContent = "Lavish could not submit this round. Try again.";
    }
  }
  roundButtons.forEach(function (button) { button.addEventListener("click", submitRound); });
  show(0);
  updateProgress();
})();
</script>
</body>
</html>
