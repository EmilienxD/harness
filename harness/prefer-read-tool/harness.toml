name = "prefer-read-tool"
version = "1.0.10"
description = "PostToolUse nudge to prefer the Read tool over shell file-read commands"
docs = "https://github.com/EmilienxD/harness/blob/main/harness/prefer-read-tool/README.md"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "unsupported"
reason = "This preference is specific to Claude Code's Read tool; shell and local reads are native ChatGPT workflows."

[[files]]
src = "claude/hooks/prefer_read_tool_PostToolUse_hook.py"
dest = "hooks/prefer_read_tool_PostToolUse_hook.py"
platforms = ["claude"]
executable = true
