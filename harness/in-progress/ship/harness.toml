name = "ship"
version = "1.3.0"
description = "Agent-led issue delivery with guarded loop implementers"
dependencies = ["subagents>=2.3.3,<3.0.0", "test-workflows>=1.6.0,<2.0.0", "issue-readers>=1.5.0,<2.0.0", "resolving-merge-conflicts"]
requires = ["git", "gh", "uv"]

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "ship_hook.py"
dest = "ship_hook.py"
root = "hooks"
executable = true

[[files]]
src = "SKILL.md"
dest = "ship/SKILL.md"
root = "skills"

[[files]]
src = "references"
dest = "ship/references"
root = "skills"

[[files]]
src = "chatgpt/openai.yaml"
dest = "ship/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
