name = "auto"
version = "1.3.3"
description = "Routes /auto and /auto --dry to an active Aboard session"
selectable = false

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[platforms.pi]
status = "supported"

[[files]]
src = "pi/extension.ts"
dest = ".harness-auto.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "auto_hook.py"
dest = "auto_hook.py"
root = "hooks"
platforms = ["claude", "chatgpt"]
executable = true

[[files]]
src = "auto_hook.py"
dest = "auto_hook.py"
root = "support"
platforms = ["pi"]
executable = true

[[files]]
src = "SKILL.md"
dest = "auto/SKILL.md"
root = "skills"
platforms = ["claude", "chatgpt"]

[[files]]
src = "chatgpt/openai.yaml"
dest = "auto/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
