name = "pi-path-guards"
version = "1.1.0"
description = "Internal Pi path-guard event handling and branch-local receipts"
selectable = false
dependencies = [{ name = "path-guard-common", version = ">=1.0.0,<2.0.0", lifecycle = "coupled", platforms = ["pi"] }, { name = "pi-transport", version = ">=1.0.0,<2.0.0", lifecycle = "coupled", platforms = ["pi"] }]

[platforms.claude]
status = "unsupported"
reason = "Internal support for native Pi extensions only."

[platforms.chatgpt]
status = "unsupported"
reason = "Internal support for native Pi extensions only."

[platforms.pi]
status = "supported"

[[files]]
src = "path_guards.ts"
dest = "pi-path-guards/path_guards.ts"
root = "support"
platforms = ["pi"]

[[files]]
src = "path_guards.py"
dest = "pi-path-guards/path_guards.py"
root = "support"
platforms = ["pi"]
