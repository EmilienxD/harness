name = "prefer-fewer-comments"
version = "2.2.0"
description = "PostToolUse hook that reads what a write added and asks for less commentary when a comment, a docstring, or the change as a whole runs over budget"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#hooks"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "prefer_fewer_comments_hook.py"
dest = "prefer_fewer_comments_hook.py"
root = "hooks"
executable = true

# Budgets and exemptions. All comments as shipped, so the hook runs on its
# defaults until the user edits it; `starter` keeps those edits across
# upgrades. The workspace root makes this policy shared by every provider.
[[files]]
src = "prefer-fewer-comments.toml"
dest = ".harness/guards/prefer-fewer-comments.toml"
root = "workspace"
starter = true
