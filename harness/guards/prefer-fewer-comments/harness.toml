name = "prefer-fewer-comments"
version = "2.3.7"
description = "Advisory comment and docstring budgets over newly written commentary, with native Pi mutation snapshots"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#hooks"

dependencies = [{ name = "pi-transport", version = ">=1.0.0,<2.0.0", lifecycle = "coupled", platforms = ["pi"] }]

[platforms.pi]
status = "supported"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "prefer_fewer_comments_hook.py"
dest = "prefer_fewer_comments_hook.py"
root = "hooks"
platforms = ["claude", "chatgpt"]
executable = true

[[files]]
src = "prefer_fewer_comments_hook.py"
dest = "prefer_fewer_comments_hook.py"
root = "support"
platforms = ["pi"]
executable = true

# Budgets and exemptions. All comments as shipped, so the hook runs on its
# defaults until the user edits it; `starter` keeps those edits across
# upgrades. The workspace root makes this policy shared by every provider.
[[files]]
src = "prefer-fewer-comments.toml"
dest = ".harness/guards/prefer-fewer-comments.toml"
root = "workspace"
starter = true
platforms = ["claude", "chatgpt"]

[[files]]
src = "prefer_fewer_comments_pi.py"
dest = "prefer_fewer_comments_pi.py"
root = "support"
platforms = ["pi"]

[[files]]
src = "pi/extension.ts"
dest = ".harness-prefer-fewer-comments/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "prefer-fewer-comments.toml"
dest = ".harness/guards/prefer-fewer-comments.toml"
root = "workspace"
platforms = ["pi"]
scopes = ["project"]
starter = true

[[files]]
src = "prefer-fewer-comments.toml"
dest = "prefer-fewer-comments.toml"
root = "support"
platforms = ["pi"]
scopes = ["user"]
starter = true
