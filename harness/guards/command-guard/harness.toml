name = "command-guard"
version = "2.1.0"
description = "Cross-platform PreToolUse guard that denies configured dangerous Bash and PowerShell commands"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#hooks"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "command_guard_hook.py"
dest = "command_guard_hook.py"
root = "hooks"
executable = true

[[files]]
src = "command-guard.toml"
dest = ".harness/guards/command-guard.toml"
root = "workspace"
starter = true
