name = "no-new-documents"
version = "1.1.0"
description = "Cross-platform PreToolUse guard that prevents agents from creating files in configured documentation directories"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#hooks"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "no_new_documents_hook.py"
dest = "no_new_documents_hook.py"
root = "hooks"
executable = true

[[files]]
src = "no-new-documents.toml"
dest = "no-new-documents.toml"
root = "hooks"
starter = true
