name = "no-new-documents"
version = "3.0.3"
description = "Cross-platform guard that routes new files in configured documentation directories through user-approved drafts"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#hooks"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "no_new_documents_hook.py"
dest = "no_new_documents_hook.py"
root = "hooks"
executable = true

[[files]]
src = "no-new-documents.toml"
dest = ".harness/guards/no-new-documents.toml"
root = "workspace"
starter = true

[[files]]
src = "approve-doc-draft/SKILL.md"
dest = "approve-doc-draft/SKILL.md"
root = "skills"

[[files]]
src = "reject-doc-draft/SKILL.md"
dest = "reject-doc-draft/SKILL.md"
root = "skills"

[[files]]
src = "approve-doc-draft/chatgpt/openai.yaml"
dest = "approve-doc-draft/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "reject-doc-draft/chatgpt/openai.yaml"
dest = "reject-doc-draft/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
