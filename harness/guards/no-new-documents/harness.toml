name = "no-new-documents"
version = "3.2.3"
description = "Cross-platform guard that routes new files in configured documentation directories through user-approved drafts"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#hooks"

dependencies = [{ name = "pi-transport", version = ">=1.0.0,<2.0.0", lifecycle = "coupled", platforms = ["pi"] }]

[platforms.pi]
status = "supported"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "no_new_documents_hook.py"
dest = "no_new_documents_hook.py"
root = "hooks"
platforms = ["claude", "chatgpt"]
executable = true

[[files]]
src = "no_new_documents_hook.py"
dest = "no_new_documents_hook.py"
root = "support"
platforms = ["pi"]
executable = true

[[files]]
src = "no-new-documents.toml"
dest = ".harness/guards/no-new-documents.toml"
root = "workspace"
platforms = ["claude", "chatgpt"]
starter = true

[[files]]
src = "no-new-documents.toml"
dest = ".harness/guards/no-new-documents.toml"
root = "workspace"
platforms = ["pi"]
scopes = ["project"]
starter = true

[[files]]
src = "no-new-documents.toml"
dest = "no-new-documents.toml"
root = "support"
platforms = ["pi"]
scopes = ["user"]
starter = true

[[files]]
src = "pi/extension.ts"
dest = ".harness-no-new-documents/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "no_new_documents_pi.py"
dest = "no_new_documents_pi.py"
root = "support"
platforms = ["pi"]

[[files]]
src = "approve-doc-draft/SKILL.md"
dest = "approve-doc-draft/SKILL.md"
root = "skills"

[[files]]
src = "reject-doc-draft/SKILL.md"
dest = "reject-doc-draft/SKILL.md"
root = "skills"

[[files]]
src = "approve-doc-draft/chatgpt/openai.yaml"
dest = "approve-doc-draft/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]

[[files]]
src = "reject-doc-draft/chatgpt/openai.yaml"
dest = "reject-doc-draft/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
