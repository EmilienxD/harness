name = "no-new-documents"
version = "1.0.0"
description = "Cross-platform PreToolUse guard that prevents agents from creating files in configured documentation directories"
docs = "https://github.com/EmilienxD/harness/blob/main/harness/guards/no-new-documents/README.md"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "shared/hooks/no_new_documents_PreToolUse_hook.py"
dest = "no_new_documents_PreToolUse_hook.py"
root = "hooks"
executable = true

[[files]]
src = "shared/hooks/no-new-documents.toml"
dest = "no-new-documents.toml"
root = "hooks"
starter = true
