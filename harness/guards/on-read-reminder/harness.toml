name = "on-read-reminder"
version = "2.2.3"
description = "PostToolUse hook that reminds the agent to read key files when it reads paths matching gitignore-style patterns"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#hooks"

dependencies = [{ name = "pi-path-guards", version = ">=1.0.0,<2.0.0", lifecycle = "coupled", platforms = ["pi"] }]

[platforms.pi]
status = "supported"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[[files]]
src = "on_read_reminder_hook.py"
dest = "on_read_reminder_hook.py"
root = "hooks"
platforms = ["claude"]
executable = true

[[files]]
src = "on_read_reminder_hook.py"
dest = "on_read_reminder_hook.py"
root = "support"
platforms = ["pi"]
executable = true

# Provider-neutral starter policy shared by every installed provider.
[[files]]
src = "on-read-reminder.toml"
dest = ".harness/guards/on-read-reminder.toml"
root = "workspace"
platforms = ["claude"]
starter = true

[[files]]
src = "pi/extension.ts"
dest = ".harness-on-read-reminder/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "on-read-reminder.toml"
dest = ".harness/guards/on-read-reminder.toml"
root = "workspace"
platforms = ["pi"]
scopes = ["project"]
starter = true

[[files]]
src = "on-read-reminder.toml"
dest = "on-read-reminder.toml"
root = "support"
platforms = ["pi"]
scopes = ["user"]
starter = true
