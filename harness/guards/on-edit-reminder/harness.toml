name = "on-edit-reminder"
version = "1.1.0"
description = "PostToolUse hook that lets edits to files matching gitignore-style patterns land, then makes the agent read the required files and fix what doesn't follow them"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#hooks"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[[files]]
src = "on_edit_reminder_hook.py"
dest = "on_edit_reminder_hook.py"
root = "hooks"
platforms = ["claude"]
executable = true

# Starter rules file: all comments, edited into real rules per project. A
# `--user` install puts it at ~/.claude/ where the hook reads global rules.
[[files]]
src = "claude/on-edit-reminder.rules"
dest = "on-edit-reminder.rules"
platforms = ["claude"]
