name = "on-edit-block"
version = "2.3.1"
description = "Blocks supported native edits and recognized shell writes on matching paths until required guidance has been read"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#hooks"

dependencies = [{ name = "path-guard-common", version = ">=1.0.0,<2.0.0", lifecycle = "coupled" }, { name = "pi-path-guards", version = ">=1.1.0,<2.0.0", lifecycle = "coupled", platforms = ["pi"] }]

[platforms.pi]
status = "supported"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[[files]]
src = "on_edit_block_hook.py"
dest = "on_edit_block_hook.py"
root = "hooks"
platforms = ["claude", "chatgpt"]
executable = true

[[files]]
src = "on_edit_block_hook.py"
dest = "on_edit_block_hook.py"
root = "support"
platforms = ["pi"]
executable = true

# Provider-neutral starter policy shared by every installed provider.
[[files]]
src = "on-edit-block.toml"
dest = ".harness/guards/on-edit-block.toml"
root = "workspace"
platforms = ["claude", "chatgpt"]
starter = true

[[files]]
src = "pi/extension.ts"
dest = ".harness-on-edit-block/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "on-edit-block.toml"
dest = ".harness/guards/on-edit-block.toml"
root = "workspace"
platforms = ["pi"]
scopes = ["project"]
starter = true

[[files]]
src = "on-edit-block.toml"
dest = "on-edit-block.toml"
root = "support"
platforms = ["pi"]
scopes = ["user"]
starter = true
