name = "on-edit-block"
version = "2.2.4"
description = "PreToolUse hook that denies Write/Edit/MultiEdit on files matching gitignore-style patterns until the agent has read the required files"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#hooks"

dependencies = [{ name = "pi-path-guards", version = ">=1.0.0,<2.0.0", lifecycle = "coupled", platforms = ["pi"] }]

[platforms.pi]
status = "supported"

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[[files]]
src = "on_edit_block_hook.py"
dest = "on_edit_block_hook.py"
root = "hooks"
platforms = ["claude"]
executable = true

[[files]]
src = "on_edit_block_hook.py"
dest = "on_edit_block_hook.py"
root = "support"
platforms = ["pi"]
executable = true

# Provider-neutral starter policy shared by every installed provider.
[[files]]
src = "on-edit-block.toml"
dest = ".harness/guards/on-edit-block.toml"
root = "workspace"
platforms = ["claude"]
starter = true

[[files]]
src = "pi/extension.ts"
dest = ".harness-on-edit-block/index.ts"
root = "extensions"
platforms = ["pi"]

[[files]]
src = "on-edit-block.toml"
dest = ".harness/guards/on-edit-block.toml"
root = "workspace"
platforms = ["pi"]
scopes = ["project"]
starter = true

[[files]]
src = "on-edit-block.toml"
dest = "on-edit-block.toml"
root = "support"
platforms = ["pi"]
scopes = ["user"]
starter = true
