name = "prototype"
version = "1.3.1"
description = "Build throwaway design prototypes to answer a design question"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "prototype/SKILL.md"
root = "skills"

[[files]]
src = "LOGIC.md"
dest = "prototype/LOGIC.md"
root = "skills"

[[files]]
src = "UI.md"
dest = "prototype/UI.md"
root = "skills"

[[files]]
src = "chatgpt/openai.yaml"
dest = "prototype/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
