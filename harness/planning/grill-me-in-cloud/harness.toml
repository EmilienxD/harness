name = "grill-me-in-cloud"
version = "2.1.8"
description = "Publishes visual design interviews to a persistent hosted board"
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"
requires = []
workspace_gitignore = [".harness/config.local.json"]

[platforms.claude]
status = "supported"
fragment = "claude/settings.fragment.json"

[platforms.chatgpt]
status = "supported"
fragment = "chatgpt/hooks.fragment.json"

[[files]]
src = "SKILL.md"
dest = "grill-me-in-cloud/SKILL.md"
root = "skills"

[[files]]
src = "grill_me_in_cloud_hook.py"
dest = "grill_me_in_cloud_hook.py"
root = "hooks"

[[files]]
src = "chatgpt/openai.yaml"
dest = "grill-me-in-cloud/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
