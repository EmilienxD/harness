name = "websearch"
version = "1.3.0"
description = "Web research with concise answers and a Markdown source index"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "websearch/SKILL.md"
root = "skills"

[[files]]
src = "sources.md"
dest = "websearch/sources.md"
root = "skills"
starter = true

[[files]]
src = "chatgpt/openai.yaml"
dest = "websearch/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
