name = "websearch"
version = "1.6.1"
description = "Web research with concise answers and a Markdown source index"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "websearch/SKILL.md"
root = "skills"

[[files]]
src = "INDEX.md"
dest = ".harness/websearch/INDEX.md"
root = "workspace"
starter = true

[[files]]
src = "chatgpt/openai.yaml"
dest = "websearch/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
