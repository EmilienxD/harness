name = "websearch"
version = "1.2.0"
description = "Web research with concise answers and a persistent source index"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "websearch/SKILL.md"
root = "skills"

[[files]]
src = "sources.py"
dest = "websearch/sources.py"
root = "skills"

[[files]]
src = "sources.json"
dest = "websearch/sources.json"
root = "skills"
starter = true

[[files]]
src = "chatgpt/openai.yaml"
dest = "websearch/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
