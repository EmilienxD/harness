name = "websearch"
version = "1.5.0"
description = "Web research with concise answers and a Markdown source index"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "websearch/SKILL.md"
root = "skills"

[[files]]
src = "INDEX.md"
dest = ".harness/websearch/INDEX.md"
root = "workspace"
starter = true
platforms = ["claude", "chatgpt"]

[[files]]
src = "INDEX.md"
dest = ".harness/websearch/INDEX.md"
root = "workspace"
starter = true
platforms = ["pi"]
scopes = ["project"]

[[files]]
src = "INDEX.md"
dest = "websearch/INDEX.md"
root = "skills"
starter = true
platforms = ["pi"]
scopes = ["user"]

[[files]]
src = "chatgpt/openai.yaml"
dest = "websearch/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
