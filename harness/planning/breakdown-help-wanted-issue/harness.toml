name = "breakdown-help-wanted-issue"
version = "1.5.1"
description = "Explore a request and agree with the user on what to build"
requires = ["git", "gh"]
docs = "https://github.com/EmilienxD/harness/blob/main/README.md#user-invoked-skills"

[platforms.claude]
status = "supported"

[platforms.chatgpt]
status = "supported"

[platforms.pi]
status = "supported"

[[files]]
src = "SKILL.md"
dest = "breakdown-help-wanted-issue/SKILL.md"
root = "skills"

[[files]]
src = "chatgpt/openai.yaml"
dest = "breakdown-help-wanted-issue/agents/openai.yaml"
root = "skills"
platforms = ["chatgpt"]
