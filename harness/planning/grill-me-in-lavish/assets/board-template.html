<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grill Me | decision board</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@400;500;600;700&display=swap");

:root {
  --paper: #f5f3ee;
  --paper-2: #e8e4dd;
  --paper-3: #ded8cf;
  --surface: #fbfaf6;
  --ink: #2d2d2d;
  --ink-2: #0d0d0d;
  --ink-soft: #6b6862;
  --ink-faint: #96918a;
  --accent: #a05a38;
  --accent-soft: #f0dfd5;
  --success: #4f6b58;
  --success-soft: #dfe8e1;
  --warning: #8a671f;
  --warning-soft: #eee4c7;
  --font-head: "Space Grotesk", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, sans-serif;
  --radius-sm: 6px;
  --radius-md: 10px;
  --shadow-card: 10px 10px 0 var(--ink-2);
  --focus: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  color: var(--ink); background: var(--paper); font-family: var(--font-body);
  line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; }
button { color: inherit; }

.nav { border-bottom: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
.nav__inner {
  max-width: 1040px; min-height: 70px; margin: auto; padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
}
.brand { display: inline-flex; align-items: center; gap: 11px; min-width: 0; }
.brand__mark { width: 38px; height: 38px; flex: none; display: grid; place-items: center; }
.brand__mark img { display: block; width: 36px; height: 36px; object-fit: contain; }
.brand__copy { display: grid; gap: 1px; }
.brand__name { color: var(--ink-2); font: 650 16px/1 var(--font-head); }
.brand__meta { color: var(--ink-faint); font: 600 9px/1 var(--font-head); letter-spacing: .18em; text-transform: uppercase; }
.round-chip {
  color: var(--ink-soft); border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent);
  border-radius: 999px; padding: 6px 10px; font: 600 10px/1 var(--font-head); letter-spacing: .14em; text-transform: uppercase;
}

.page { max-width: 1040px; margin: auto; padding: 44px 24px 72px; }
.hero { margin-bottom: 24px; }
.progress { margin-top: 19px; }
.progress__row { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 7px; color: var(--ink-soft); font: 600 10px/1 var(--font-head); letter-spacing: .1em; text-transform: uppercase; }
.progress__track { height: 6px; overflow: hidden; border-radius: 999px; background: var(--paper-2); }
.progress__bar { height: 100%; width: 0; border-radius: inherit; background: var(--ink-2); transition: width 180ms ease; }

.question-strip { margin-bottom: 26px; padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
.question-strip__head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 9px; }
.section-label { color: var(--accent); font: 650 10px/1 var(--font-head); letter-spacing: .2em; text-transform: uppercase; }
.section-hint { color: var(--ink-faint); font-size: 11px; text-align: right; }
.question-map { display: flex; gap: 7px; overflow-x: auto; padding: 1px 1px 4px; scrollbar-width: thin; }
.map-btn {
  min-width: 48px; height: 38px; flex: 0 0 auto; cursor: pointer; color: var(--ink-soft); background: transparent;
  border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); border-radius: var(--radius-sm);
  padding: 0 13px; font: 650 10px/1 var(--font-head); letter-spacing: .1em; transition: transform 120ms, border-color 120ms, background 120ms;
}
.map-btn:hover { transform: translateY(-1px); border-color: var(--ink); }
.map-btn:focus-visible { outline: none; box-shadow: var(--focus); }
.map-btn.is-active { color: var(--paper); border-color: var(--ink-2); background: var(--ink-2); }
.map-btn.is-queued, .map-btn.is-sent { color: var(--success); border-color: var(--success); background: var(--success-soft); }
.map-btn.is-edited { color: var(--warning); border-color: var(--warning); background: var(--warning-soft); }
.map-btn.is-active.is-queued, .map-btn.is-active.is-sent { color: var(--paper); background: var(--success); }
.map-btn.is-active.is-edited { color: var(--paper); background: var(--warning); }

.deck-wrap { min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
.deck { position: relative; display: grid; margin-right: 10px; margin-bottom: 10px; }
.deck::before { content: ""; position: absolute; inset: 0; z-index: 0; transform: translate(10px, 10px); background: var(--ink-2); border-radius: var(--radius-md); }
.deck.is-last::before { transform: translate(7px, 7px); }
.question { grid-area: 1 / 1; z-index: 1; overflow: hidden; background: var(--surface); border: 1.5px solid var(--ink-2); border-radius: var(--radius-md); }
.question[hidden] { display: none; }
.question__pad { padding: clamp(24px, 4vw, 38px); }
.question__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
.qid { color: var(--ink-faint); font: 650 10px/1 var(--font-head); letter-spacing: .2em; text-transform: uppercase; }
.state { color: var(--ink-faint); font: 650 10px/1 var(--font-head); letter-spacing: .13em; text-transform: uppercase; }
.state.is-queued, .state.is-sent { color: var(--success); }
.state.is-edited { color: var(--warning); }
.question h2 { max-width: 760px; margin: 0; color: var(--ink-2); font: 600 clamp(25px, 4vw, 36px)/1.08 var(--font-head); letter-spacing: 0; text-wrap: balance; }
.explanation { min-width: 0; margin: 18px 0 22px; color: var(--ink-soft); font-size: 15px; line-height: 1.62; }
.explanation > :first-child { margin-top: 0; }
.explanation > :last-child { margin-bottom: 0; }
.explanation p { margin: 0 0 12px; }
.explanation h3 { color: var(--ink-2); font: 600 18px/1.3 var(--font-head); }
.explanation .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.explanation .grid > * { min-width: 0; }
.explanation .panel { padding: 16px; border: 1px solid var(--paper-3); border-radius: var(--radius-sm); background: var(--paper); }
.explanation .note { padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); color: var(--ink); }
.explanation .table-wrap { max-width: 100%; overflow-x: auto; }
.explanation table { width: 100%; border-collapse: collapse; font-size: 13px; }
.explanation th, .explanation td { padding: 10px 12px; border-bottom: 1px solid var(--paper-3); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.explanation th { color: var(--ink-2); font-weight: 700; }
.explanation img, .explanation svg, .explanation video, .explanation canvas { display: block; max-width: 100%; height: auto; }
.explanation figure { margin: 16px 0; }
.explanation figcaption { margin-top: 8px; font-size: 12px; }
.explanation pre { max-width: 100%; overflow-x: auto; padding: 12px; background: var(--paper-2); border-radius: var(--radius-sm); }
.explanation select, .explanation input, .explanation button { max-width: 100%; }
.explanation details { padding: 12px 0; }
.explanation summary { cursor: pointer; color: var(--ink); font-weight: 600; }
.explanation p, .explanation li { overflow-wrap: anywhere; }
@media (max-width: 640px) { .explanation .grid { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .explanation *, .explanation *::before, .explanation *::after { animation: none !important; transition: none !important; } }

.answer-form { display: flex; flex-direction: column; gap: 15px; }
.options { display: flex; flex-direction: column; gap: 9px; }
.option { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 13px 14px; cursor: pointer; background: var(--surface); border: 1px solid var(--paper-3); border-radius: var(--radius-sm); transition: border-color 120ms, background 120ms, transform 120ms; }
.option:hover { border-color: color-mix(in srgb, var(--ink) 50%, transparent); transform: translateY(-1px); }
.option:has(input:focus-visible) { box-shadow: var(--focus); }
.option:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 44%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent); }
.option input { width: 17px; height: 17px; margin: 3px 0 0; accent-color: var(--accent); }
.option__copy { min-width: 0; }
.option__label { display: block; color: var(--ink-2); font-size: 14px; font-weight: 700; }
.option__detail { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 12px; }
.rec-badge { align-self: center; color: var(--ink-soft); font: 600 10px/1.3 var(--font-head); }

.freeform { padding: 14px; border: 1px solid var(--paper-3); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--paper-2) 42%, var(--surface)); }
.freeform__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.freeform label { color: var(--ink); font-size: 12px; font-weight: 700; }
.text-link { padding: 0; color: var(--accent); background: none; border: 0; cursor: pointer; font-size: 11px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.text-link:focus-visible { outline: none; border-radius: 3px; box-shadow: var(--focus); }
.freeform textarea { width: 100%; min-height: 84px; resize: vertical; padding: 11px 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--paper-3); border-radius: var(--radius-sm); font-size: 13px; line-height: 1.45; }
.freeform textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
.freeform__hint { display: block; margin-top: 6px; color: var(--ink-faint); font-size: 11px; }

.question__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-top: 3px; border-top: 1px solid color-mix(in srgb, var(--ink) 9%, transparent); }
.submit { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px; color: var(--paper); background: var(--ink-2); border: 1px solid var(--ink-2); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 700; transition: background 120ms, transform 120ms; }
.submit:hover { background: var(--ink); transform: translateY(-1px); }
.submit:active { transform: translateY(1px); }
.submit:focus-visible { outline: none; box-shadow: var(--focus); }
.queued-badge { display: none; align-items: center; gap: 6px; color: var(--success); background: var(--success-soft); border: 1px solid color-mix(in srgb, var(--success) 28%, transparent); border-radius: 5px; padding: 7px 10px; font: 700 9px/1 var(--font-head); letter-spacing: .12em; text-transform: uppercase; }
.question.is-queued .queued-badge, .question.is-sent .queued-badge { display: inline-flex; }
.form-message { flex-basis: 100%; min-height: 18px; color: var(--accent); font-size: 12px; font-weight: 700; }

.deck-nav { display: flex; align-items: center; gap: 9px; margin-top: 22px; }
.deck-nav__count { flex: 1; color: var(--ink-faint); font: 650 10px/1 var(--font-head); letter-spacing: .12em; text-transform: uppercase; }
.nav-btn { width: 39px; height: 39px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); background: transparent; border: 1px solid color-mix(in srgb, var(--ink) 24%, transparent); border-radius: var(--radius-sm); transition: transform 120ms, border-color 120ms; }
.nav-btn:hover { transform: translateY(-1px); border-color: var(--ink-2); }
.nav-btn:focus-visible { outline: none; box-shadow: var(--focus); }
.nav-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }
.nav-btn svg { width: 17px; height: 17px; }

.round-action { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin-top: 38px; padding: 25px 28px; color: var(--paper); background: var(--ink-2); border-radius: var(--radius-md); }
.round-action__copy { flex: 1 1 280px; }
.round-action__eyebrow { display: block; color: color-mix(in srgb, var(--paper) 48%, transparent); font: 650 9px/1 var(--font-head); letter-spacing: .2em; text-transform: uppercase; }
.round-action__title { display: block; margin-top: 7px; font: 600 21px/1.15 var(--font-head); }
.round-action__status { display: block; margin-top: 5px; color: color-mix(in srgb, var(--paper) 58%, transparent); font-size: 12px; }
.round-submit { color: var(--ink-2); background: var(--paper); border-color: var(--paper); }
.round-submit:hover { color: var(--paper); background: var(--accent); border-color: var(--accent); }
.round-submit:disabled { opacity: .42; cursor: not-allowed; transform: none; }
.round-message { flex-basis: 100%; min-height: 18px; color: var(--accent-soft); font-size: 12px; font-weight: 700; }
.footer { margin-top: 25px; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink-faint); font: 500 9px/1.5 var(--font-head); letter-spacing: .08em; text-transform: uppercase; }

.fatal { max-width: 720px; margin: 50px auto; padding: 28px; background: var(--surface); border: 1.5px solid var(--ink-2); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
.fatal h2 { margin: 0 0 8px; color: var(--ink-2); font-family: var(--font-head); }

@media (prefers-reduced-motion: no-preference) {
  .question:not([hidden]) { animation: settle 260ms cubic-bezier(.2,.7,.2,1) both; }
  @keyframes settle { from { opacity: .72; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
@media (max-width: 760px) {
  .page { padding-top: 30px; }
  .question-strip__head { align-items: flex-start; }
}
@media (max-width: 560px) {
  .nav__inner, .page { padding-left: 17px; padding-right: 17px; }
  .brand__meta { display: none; }
  .section-hint { display: none; }
  .question__top, .freeform__head { align-items: flex-start; }
  .option { grid-template-columns: auto minmax(0, 1fr); }
  .rec-badge { grid-column: 2; justify-self: start; }
  .question__foot { align-items: stretch; }
  .submit { width: 100%; }
  .round-action { padding: 22px; }
  .round-submit { width: 100%; }
}
</style>

    <button class="submit round-submit" id="submit-round" type="button" disabled>Submit round</button>

<!--
Replace the single data placeholder in the script below with JSON shaped like:
{
  "round": 1,
  "questions": [{
    "id": "Q1",
    "question": "Where should configuration live?",
    "explanation_html": "<p>Explain why this decision matters.</p><p>Describe relevant consequences.</p>",
    "recommendation": "A",
    "init_js": "root.dataset.example = 'ready';",
    "options": [
      {"letter": "A", "label": "Project configuration", "detail": "Why this option matters."},
      {"letter": "B", "label": "User configuration", "detail": "Tradeoff or consequence."}
    ]
  }]
}
init_js is optional and runs once with the explanation element as root.
Only explanation_html is rendered as HTML; question and options are plain text.
-->
<script id="grill-data" type="application/json">
__GRILL_ME_DATA__
</script>

<script>
(function () {
  "use strict";

  function node(tag, className, text) {
    var element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined && text !== null) element.textContent = text;
    return element;
  }

  function fatal(message) {
    var app = document.getElementById("app");
    app.innerHTML = "";
    var box = node("section", "fatal");
    box.appendChild(node("h2", "", "This decision board could not load"));
    box.appendChild(node("p", "", message + " Ask the agent to rebuild the artifact."));
    app.appendChild(box);
  }

  var data;
  try {
    data = JSON.parse(document.getElementById("grill-data").textContent);
  } catch (error) {
    fatal("The embedded round data is not valid JSON.");
    return;
  }

  if (!data || typeof data !== "object") {
    fatal("The round data must be an object.");
    return;
  }
  document.getElementById("round-chip").textContent = "round " + (data.round || 1);
  if (data.complete === true || data.cancel === true) {
    var app = document.getElementById("app");
    app.innerHTML = "";
    var summary = node("section", "question question__pad");
    summary.appendChild(node("h2", "", data.cancel ? "Interview cancelled" : "Shared understanding reached"));
    if (data.summary) summary.appendChild(node("p", "explanation", data.summary));
    summary.appendChild(node("p", "", data.cancel ? "Continue in chat. No unanswered decisions have been approved." : "Confirm the shared understanding in chat before proceeding to the next steps."));
    app.appendChild(summary);
    return;
  }

  var valid = data && Array.isArray(data.questions) && data.questions.length > 0 && data.questions.every(function (question) {
    return question && typeof question.id === "string" && question.id &&
      typeof question.question === "string" && question.question &&
      typeof question.explanation_html === "string" &&
      Array.isArray(question.options) && question.options.length >= 1 && question.options.length <= 4 &&
      question.options.some(function (option) { return option.letter === question.recommendation; }) &&
      question.options.every(function (option) {
        return option && typeof option.letter === "string" && typeof option.label === "string" && option.label;
      });
  });
  if (!valid) {
    fatal("The round data is missing required questions, explanations, options, or a valid recommendation.");
    return;
  }

  document.getElementById("provenance").textContent = "Grill Me in Lavish · round " + (data.round || 1) + " · " + data.questions.length + " open decision" + (data.questions.length === 1 ? "" : "s");

  var deck = document.getElementById("deck");
  var map = document.getElementById("question-map");
  var states = data.questions.map(function () { return "open"; });
  var cards = [];
  var mapButtons = [];
  var active = 0;
  var roundSubmitted = false;
  var roundButton = document.getElementById("submit-round");
  var roundStatus = document.getElementById("round-status");
  var roundMessage = document.getElementById("round-message");

  function optionPrompt(question, form) {
    var selected = form.querySelector('input[name="answer"]:checked');
    var note = form.querySelector("textarea").value.trim();
    if (!selected && !note) return "";
    var lines = ["Answer to " + question.id + ": " + question.question];
    if (selected) {
      var selectedOption = question.options.find(function (option) { return option.letter === selected.value; });
      lines.push("Choice: " + selected.value + ": " + selectedOption.label);
      if (note) lines.push("Additional context: " + note);
    } else {
      lines.push("My own answer: " + note);
    }
    return lines.join("\n");
  }

  function updateProgress() {
    var queued = states.filter(function (state) { return state === "queued"; }).length;
    var sent = states.filter(function (state) { return state === "sent"; }).length;
    document.getElementById("progress-copy").textContent = roundSubmitted ? sent + " submitted" : queued + " queued";
    document.getElementById("progress-total").textContent = data.questions.length + " total";
    document.getElementById("progress-bar").style.width = ((roundSubmitted ? sent : queued) / data.questions.length * 100) + "%";
    var edited = states.filter(function (state) { return state === "edited"; }).length;
    roundButton.disabled = roundSubmitted || queued === 0 || edited > 0;
    if (roundSubmitted) {
      roundStatus.textContent = sent + " answer" + (sent === 1 ? "" : "s") + " submitted. The agent will build the next round.";
    } else if (edited) {
      roundStatus.textContent = "Queue every edited answer again before submitting the round.";
    } else if (queued) {
      roundStatus.textContent = queued + " answer" + (queued === 1 ? "" : "s") + " queued. Unqueued questions will remain open.";
    } else {
      roundStatus.textContent = "Queue at least one answer. Unqueued questions will remain open.";
    }
  }

  function updateState(index, state) {
    states[index] = state;
    var card = cards[index];
    var status = card.querySelector(".state");
    var queueButton = card.querySelector('button[type="submit"]');
    card.classList.toggle("is-queued", state === "queued");
    card.classList.toggle("is-sent", state === "sent");
    status.className = "state" + (state === "queued" ? " is-queued" : state === "sent" ? " is-sent" : state === "edited" ? " is-edited" : "");
    status.textContent = state === "queued" ? "answer queued" : state === "sent" ? "round submitted" : state === "edited" ? "edited: queue again" : "open";
    queueButton.textContent = state === "queued" ? "Update queued answer" : state === "edited" ? "Queue updated answer" : state === "sent" ? "Round submitted" : "Queue this answer";
    mapButtons[index].className = "map-btn" + (index === active ? " is-active" : "") + (state === "queued" ? " is-queued" : state === "sent" ? " is-sent" : state === "edited" ? " is-edited" : "");
    updateProgress();
  }

  function show(index) {
    active = Math.max(0, Math.min(cards.length - 1, index));
    cards.forEach(function (card, cardIndex) { card.hidden = cardIndex !== active; });
    mapButtons.forEach(function (button, buttonIndex) {
      button.classList.toggle("is-active", buttonIndex === active);
      button.setAttribute("aria-current", buttonIndex === active ? "true" : "false");
    });
    document.getElementById("deck-count").textContent = "question " + (active + 1) + " of " + cards.length;
    document.getElementById("prev").disabled = active === 0;
    document.getElementById("next").disabled = active === cards.length - 1;
    deck.classList.toggle("is-last", active === cards.length - 1);
  }

  data.questions.forEach(function (question, index) {
    var card = node("article", "question");
    var pad = node("div", "question__pad");
    var top = node("div", "question__top");
    top.appendChild(node("span", "qid", question.id));
    top.appendChild(node("span", "state", "open"));
    pad.appendChild(top);
    pad.appendChild(node("h2", "", question.question));
    var explanation = node("div", "explanation");
    explanation.id = "explanation-" + question.id;
    explanation.innerHTML = question.explanation_html;
    pad.appendChild(explanation);

    var form = node("form", "answer-form");
    form.setAttribute("data-lavish-question", question.id);
    var options = node("div", "options");
    question.options.forEach(function (option) {
      var label = node("label", "option");
      var radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "answer";
      radio.value = option.letter;
      label.appendChild(radio);
      var copy = node("span", "option__copy");
      copy.appendChild(node("span", "option__label", option.letter + ". " + option.label));
      if (option.detail) copy.appendChild(node("span", "option__detail", option.detail));
      label.appendChild(copy);
      if (option.letter === question.recommendation) label.appendChild(node("span", "rec-badge", "Recommended"));
      options.appendChild(label);
    });
    form.appendChild(options);

    var freeform = node("div", "freeform");
    var freeformHead = node("div", "freeform__head");
    var textareaId = "freeform-" + index;
    var textareaLabel = node("label", "", "Add nuance or give a different answer");
    textareaLabel.htmlFor = textareaId;
    freeformHead.appendChild(textareaLabel);
    var ownAnswer = node("button", "text-link", "Write my own answer");
    ownAnswer.type = "button";
    freeformHead.appendChild(ownAnswer);
    freeform.appendChild(freeformHead);
    var textarea = document.createElement("textarea");
    textarea.id = textareaId;
    textarea.name = "note";
    textarea.maxLength = 2000;
    textarea.placeholder = "Add constraints, explain your reasoning, or answer outside these options…";
    freeform.appendChild(textarea);
    freeform.appendChild(node("span", "freeform__hint", "Choose an option with context, or use your written answer on its own."));
    form.appendChild(freeform);

    var foot = node("div", "question__foot");
    var submit = node("button", "submit", "Queue this answer");
    submit.type = "submit";
    foot.appendChild(submit);
    var queuedBadge = node("span", "queued-badge", "✓ queued for this round");
    foot.appendChild(queuedBadge);
    var message = node("span", "form-message");
    message.setAttribute("role", "alert");
    foot.appendChild(message);
    form.appendChild(foot);

    function markEdited() {
      message.textContent = "";
      roundMessage.textContent = "";
      if (states[index] === "queued") updateState(index, "edited");
    }
    form.addEventListener("change", markEdited);
    textarea.addEventListener("input", markEdited);
    ownAnswer.addEventListener("click", function () {
      form.querySelectorAll('input[name="answer"]').forEach(function (radio) { radio.checked = false; });
      markEdited();
      textarea.focus();
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      message.textContent = "";
      var prompt = optionPrompt(question, form);
      if (!prompt) {
        message.textContent = "Choose an option or write your own answer first.";
        return;
      }
      if (!window.lavish || typeof window.lavish.queuePrompt !== "function") {
        message.textContent = "Open this artifact through Lavish to queue an answer.";
        return;
      }
      try {
        /* Intentionally send natural language only. No structured data object is
           attached, so JSON never becomes part of the agent conversation. */
        window.lavish.queuePrompt(prompt, {
          queueKey: "grill-round-" + (data.round || 1) + "-" + question.id,
          element: form
        });
        updateState(index, "queued");
        message.textContent = "";
        var nextOpen = states.findIndex(function (state, stateIndex) { return stateIndex > index && state === "open"; });
        if (nextOpen < 0) nextOpen = states.findIndex(function (state) { return state === "open"; });
        if (nextOpen >= 0 && nextOpen !== index) setTimeout(function () { show(nextOpen); }, 420);
      } catch (error) {
        message.textContent = "Lavish could not queue this answer. Try again.";
      }
    });

    pad.appendChild(form);
    card.appendChild(pad);
    deck.appendChild(card);
    cards.push(card);
    if (question.init_js) {
      try {
        new Function("root", '"use strict";\n' + question.init_js)(explanation);
      } catch (error) {
        explanation.appendChild(node("p", "note", "The interactive example could not initialize. Ask the agent to repair it."));
        console.error("Grill explanation initialization failed", question.id, error);
      }
    }

    var mapButton = node("button", "map-btn", question.id);
    mapButton.type = "button";
    mapButton.setAttribute("aria-label", "Open " + question.id + ": " + question.question);
    mapButton.addEventListener("click", function () { show(index); });
    map.appendChild(mapButton);
    mapButtons.push(mapButton);
  });

  document.getElementById("prev").addEventListener("click", function () { show(active - 1); });
  document.getElementById("next").addEventListener("click", function () { show(active + 1); });
  roundButton.addEventListener("click", function () {
    roundMessage.textContent = "";
    var edited = states.filter(function (state) { return state === "edited"; }).length;
    var queued = states.filter(function (state) { return state === "queued"; }).length;
    if (edited) {
      roundMessage.textContent = "Queue every edited answer again before submitting.";
      return;
    }
    if (!queued) {
      roundMessage.textContent = "Queue at least one answer before submitting the round.";
      return;
    }
    if (!window.lavish || typeof window.lavish.sendQueuedPrompts !== "function") {
      roundMessage.textContent = "Open this artifact through Lavish to submit the round.";
      return;
    }
    try {
      window.lavish.sendQueuedPrompts();
      roundSubmitted = true;
      states.forEach(function (state, index) {
        if (state === "queued") updateState(index, "sent");
      });
      cards.forEach(function (card) {
        card.querySelectorAll("input, textarea, button").forEach(function (control) { control.disabled = true; });
      });
      roundButton.textContent = "Round submitted";
      roundMessage.textContent = queued + " answer" + (queued === 1 ? "" : "s") + " sent to the agent.";
      updateProgress();
    } catch (error) {
      roundMessage.textContent = "Lavish could not submit this round. Try again.";
    }
  });
  show(0);
  updateProgress();
})();
</script>
</body>
</html>
