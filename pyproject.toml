[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness"
version = "0.4.2"
description = "Ephemeral catalogue installer for agent skills, hooks, tools, and apps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EmilienxD" }]
keywords = ["claude", "claude-code", "chatgpt", "skills", "hooks", "agent"]
dependencies = []

[project.urls]
Homepage = "https://github.com/EmilienxD/harness"
Source = "https://github.com/EmilienxD/harness"

[project.scripts]
harness = "harness_cli.cli:main"

[dependency-groups]
dev = [
    "portalocker>=4.2.0",
    "pytest>=8.0",
    "PyYAML>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_cli"]

# The tool payload lives at the repo root as plain files so it stays readable and
# editable in-repo; it is shipped inside the wheel as package data.
[tool.hatch.build.targets.wheel.force-include]
"harness" = "harness_cli/_tools"

[tool.hatch.build.targets.sdist]
include = ["src/harness_cli", "harness", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["harness/productivity/subagents/runtime/src"]
