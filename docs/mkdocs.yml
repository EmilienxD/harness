site_name: Harness documentation
site_description: User guides for installing and configuring Harness tools
site_url: https://harness-docs-emb10.vercel.app/
docs_dir: user
site_dir: site
theme:
  name: material
  logo: assets/harness_logo_white_transparent.png
  favicon: assets/harness_logo_black_transparent.png
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
extra_css:
  - assets/stylesheets/harness.css
nav:
