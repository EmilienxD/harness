name: Release Aboard

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already merged in apps/aboard/package.json
        required: true
        type: string

concurrency:
  group: release-aboard
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/aboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version
        working-directory: apps/aboard
        run: |
          node - <<'NODE'
          const packageJson = require('./package.json');
          const lock = require('./package-lock.json');
          const requested = process.env.VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(requested)) throw new Error(`Invalid version: ${requested}`);
          if (packageJson.version !== requested) throw new Error(`package.json is ${packageJson.version}, not ${requested}`);
          if (lock.version !== requested || lock.packages[''].version !== requested) {
            throw new Error('package-lock.json version does not match package.json');
          }
          NODE

      - name: Build and publish immutable release
        id: publish
        run: |
          TAG="aboard-v${VERSION}"
          ASSET="aboard-${VERSION}.vsix"
          mkdir release-dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern "$ASSET" --dir release-dist
            echo "Reusing the already-published asset for a safe retry."
          else
            if git rev-parse --verify --quiet "refs/tags/$TAG"; then
              echo "Tag $TAG exists without a GitHub release; refusing an ambiguous release." >&2
              exit 1
            fi
            cd apps/aboard
            npm ci
            npm test
            npm run package
            cd ../..
            cp "apps/aboard/dist/$ASSET" "release-dist/$ASSET"
            SOURCE_SHA="$(git rev-parse HEAD)"
            gh release create "$TAG" "release-dist/$ASSET" \
              --target "$SOURCE_SHA" \
              --title "Aboard v${VERSION}" \
              --generate-notes
          fi

      - name: Open catalogue pin pull request
        run: |
          BRANCH="automation/aboard-pin-${VERSION}"
          if [ "$(gh pr list --state open --head "$BRANCH" --json number --jq length)" -gt 0 ]; then
            echo "The catalogue pin pull request is already open."
            exit 0
          fi
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH"
          python scripts/aboard_release.py update-pin \
            --version "$VERSION" \
            --vsix "release-dist/aboard-${VERSION}.vsix"
          if git diff --quiet; then
            echo "The catalogue already pins this exact release."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add harness/extension/aboard/harness.toml
          git commit -m "Pin Aboard v${VERSION} release"
          git push --force-with-lease --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Pin Aboard v${VERSION} release" \
            --body "Updates the Aboard catalogue action from the exact published VSIX bytes. Generated by the Release Aboard workflow."
