name: Aboard

on:
  push:
    branches: [main]
    tags: ["aboard-v*"]
    paths:
      - "apps/aboard/**"
      - ".github/workflows/aboard.yml"
  pull_request:
    paths:
      - "apps/aboard/**"
      - ".github/workflows/aboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/aboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Test serially
        run: npm run test:build && node --test --test-concurrency=1 dist/test/*.test.js

  release:
    if: startsWith(github.ref, 'refs/tags/aboard-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/aboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aboard/package-lock.json
      - run: npm ci
      - name: Check tag against package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "aboard-v$version"
      - run: npm run package
      - name: Publish VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving its immutable artifact unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "dist/aboard-$version.vsix" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aboard $version" \
            --generate-notes
