name: Aboard CI

on:
  pull_request:
    paths:
      - "apps/aboard/**"
      - ".github/workflows/aboard-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/aboard/**"
      - ".github/workflows/aboard-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/aboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/aboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.7
      - run: npm ci
      - name: Check package versions agree
        run: |
          node - <<'NODE'
          const packageJson = require('./package.json');
          const lock = require('./package-lock.json');
          if (packageJson.version !== lock.version || packageJson.version !== lock.packages[''].version) {
            throw new Error('package.json and package-lock.json versions must agree');
          }
          NODE
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm test
      - run: xvfb-run --auto-servernum npm run test:vscode
      - run: npm run package
