name: Harness CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Weekly full Python compatibility matrix.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.select.outputs.python }}
      distribution: ${{ steps.select.outputs.distribution }}
      shared_e2e: ${{ steps.select.outputs.shared_e2e }}
      python_matrix: ${{ steps.select.outputs.python_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: python scripts/ci_changes.py

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.7
      - run: uv sync --frozen
      - run: uv run pytest

  distribution:
    name: Python distribution
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.7
      - run: uv build
      - run: uvx --from twine==7.0.0 twine check dist/harness-*.whl dist/harness-*.tar.gz
      - name: Verify source distribution boundary
        run: |
          python - <<'PY'
          import pathlib
          import tarfile

          archive = next(pathlib.Path("dist").glob("harness-*.tar.gz"))
          with tarfile.open(archive) as package:
              names = package.getnames()
          root = names[0].split("/", 1)[0]
          unexpected = [name for name in names if name.startswith(f"{root}/apps/") or "/.vscode-test/" in name]
          if unexpected:
              raise SystemExit("source distribution crossed the Python package boundary:\n" + "\n".join(unexpected))
          PY

  shared-e2e:
    name: Shared E2E / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.shared_e2e == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML==6.0.3
      - run: npm install --global @anthropic-ai/claude-code@2.1.270 @openai/codex@0.154.0
      - run: npm ci
      - run: npm run check
      - run: npm test

  result:
    name: Harness CI result
    needs: [changes, python, distribution, shared-e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check selected jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in jobs.items() if job["result"] not in {"success", "skipped"}]
          if jobs["changes"]["result"] != "success" or failed:
              raise SystemExit("CI did not pass: " + ", ".join(failed or ["changes"]))
          print("All selected checks passed.")
          PY
