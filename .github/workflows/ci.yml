name: Harness CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.7
      - run: uv sync --frozen
      - run: uv run pytest

  distribution:
    name: Python distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.7
      - run: uv build
      - run: uvx --from twine==7.0.0 twine check dist/harness-*.whl dist/harness-*.tar.gz
      - name: Verify source distribution boundary
        run: |
          python - <<'PY'
          import pathlib
          import tarfile

          archive = next(pathlib.Path("dist").glob("harness-*.tar.gz"))
          with tarfile.open(archive) as package:
              names = package.getnames()
          root = names[0].split("/", 1)[0]
          unexpected = [name for name in names if name.startswith(f"{root}/apps/") or "/.vscode-test/" in name]
          if unexpected:
              raise SystemExit("source distribution crossed the Python package boundary:\n" + "\n".join(unexpected))
          PY

  shared-e2e:
    name: Shared E2E / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML==6.0.3
      - run: npm install --global @anthropic-ai/claude-code@2.1.270 @openai/codex@0.154.0
      - run: npm ci
      - run: npm run check
      - run: npm test
