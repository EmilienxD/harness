name: Update documentation references

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update reference sets
        run: >-
          python scripts/update_references.py
          docs/CLAUDE-REFERENCES
          docs/CHATGPT-REFERENCES

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git add docs/CLAUDE-REFERENCES docs/CHATGPT-REFERENCES
          git commit -m "Update documentation references"
          git push
