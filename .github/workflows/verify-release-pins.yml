name: Verify release pins

on:
  workflow_dispatch:

# Verify on demand to reserve the free allowance for releases.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/aboard_release.py verify-pins
